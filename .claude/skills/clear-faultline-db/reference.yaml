---
# Clear FaultLine DB — per-tenant wipe for a clean pre-prod test
# Drops tenant schema + public rows + Qdrant collection, restarts mcp + redis.
# Codified from the live procedure run before oracle/E2E test runs.

name: clear-faultline-db
description: "Wipe one FaultLine tenant clean — drop per-tenant schema, delete public rows, delete per-user Qdrant collection, restart faultline-mcp + faultline-redis."
version: 1.0.0
author: Christopher
environment: pre-production
destructive: true

tags:
  - faultline
  - database
  - reset
  - wipe
  - qdrant
  - provisioning

config:
  ssh_host: "truenas"
  postgres_container: "faultline-postgres"
  postgres_role: "faultline"          # NOT faultline_test
  postgres_db: "faultline_test"
  mcp_container: "faultline-mcp"
  redis_container: "faultline-redis"
  backend_container: "faultline"      # (the API/backend; not needed to restart for a wipe)
  qdrant_local_url: "http://localhost:6333"   # run via ssh on truenas
  # The standard test user. Override per run.
  user_id: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"
  # Derived (do NOT touch the env-default collections faultline-test / faultline-preprod):
  #   schema     = faultline_<user_id with dashes replaced by underscores>
  #   collection = faultline-<user_id with dashes>

parameters:
  - name: user_id
    description: Tenant UUID to wipe (OpenWebUI user id)
    required: false
    default: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"
  - name: confirm_fresh
    description: After the wipe, fire a recall to trigger re-provision and verify seeds
    required: false
    default: "true"

# ═══════════════════════════════════════════════════════════════════
# GOTCHAS (learned live — do not skip)
# ═══════════════════════════════════════════════════════════════════
gotchas:
  - "docker exec WITHOUT -i drops stdin → a heredoc piped to psql (psql <<SQL) runs NOTHING and prints NOTHING (silent no-op). ALWAYS use psql -c \"...\" statements over ssh, never a heredoc. Verify row counts after."
  - "Schema name uses UNDERSCORES (faultline_10d7d879_63cd_...), Qdrant collection uses DASHES (faultline-10d7d879-63cd-...). Mixing them = 'schema not found' / wrong collection."
  - "MUST restart faultline-mcp after the wipe or _provisioned_users (in-memory set) keeps the old uid cached → re-provisioning never fires → next request finds no schema. CLAUDE.md hard rule."
  - "NEVER delete the faultline-test or faultline-preprod Qdrant collections — those are the env-default/shared collections, not per-user."
  - "Tenant-schema tables (facts, staged_facts, entity_aliases, entities) have NO user_id column — the schema IS the tenant boundary. Only public.* tables carry user_id."
  - "Wipe DB + Qdrant FIRST, restart mcp+redis LAST — so a cleared provisioning set isn't repopulated by an in-flight request before the data is gone."

# ═══════════════════════════════════════════════════════════════════
# STEPS (run in order; substitute {{USER_ID}} / {{SCHEMA}} / {{COLLECTION}})
#   {{SCHEMA}}     = faultline_<USER_ID with - → _>
#   {{COLLECTION}} = faultline-<USER_ID>
# ═══════════════════════════════════════════════════════════════════
steps:

  # ── 0. DISCOVER / CONFIRM TARGETS (non-destructive) ──
  - id: 0a_list_schema
    why: "Confirm the tenant schema exists and you have the exact name."
    command: |
      ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE 'faultline%';\""

  - id: 0b_list_public_rows
    why: "See which public.* tables actually hold rows for this user (so nothing is missed)."
    command: |
      ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"
      SELECT c.table_name, (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM public.%I WHERE user_id=%L', c.table_name, '{{USER_ID}}'), false, true, '')))[1]::text::int AS n
      FROM information_schema.columns c
      JOIN information_schema.tables t ON t.table_schema='public' AND t.table_name=c.table_name AND t.table_type='BASE TABLE'
      WHERE c.table_schema='public' AND c.column_name='user_id'
      ORDER BY n DESC, c.table_name;\""

  - id: 0c_list_collections
    why: "Confirm the per-user collection name; never touch faultline-test/faultline-preprod."
    command: |
      ssh truenas -x "curl -sS http://localhost:6333/collections" | python3 -c "import sys,json;print([c['name'] for c in json.load(sys.stdin)['result']['collections'] if 'faultline' in c['name']])"

  # ── 1+2. DROP SCHEMA + DELETE PUBLIC ROWS (one psql call, -c statements) ──
  - id: 1_drop_schema_and_public
    why: "Drop the tenant schema CASCADE and sweep ALL public.* per-user rows generically."
    note: "The DO block deletes the user's rows from every public table that has a user_id column — robust against new per-user tables. Uses -c (NOT heredoc)."
    command: |
      ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -v ON_ERROR_STOP=1 \
        -c \"DROP SCHEMA IF EXISTS {{SCHEMA}} CASCADE;\" \
        -c \"DO \\\$\\\$ DECLARE r record; BEGIN FOR r IN SELECT c.table_name FROM information_schema.columns c JOIN information_schema.tables t ON t.table_schema='public' AND t.table_name=c.table_name AND t.table_type='BASE TABLE' WHERE c.table_schema='public' AND c.column_name='user_id' LOOP EXECUTE format('DELETE FROM public.%I WHERE user_id = %L', r.table_name, '{{USER_ID}}'); END LOOP; END \\\$\\\$;\""
    fallback_explicit: |
      # If the DO-block $$ quoting fights the shell, delete the known per-user public tables explicitly:
      ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -v ON_ERROR_STOP=1 \
        -c \"DROP SCHEMA IF EXISTS {{SCHEMA}} CASCADE;\" \
        -c \"DELETE FROM public.confidence_gates WHERE user_id='{{USER_ID}}';\" \
        -c \"DELETE FROM public.intent_confidence_feedback WHERE user_id='{{USER_ID}}';\" \
        -c \"DELETE FROM public.user_provisioning WHERE user_id='{{USER_ID}}';\" \
        -c \"DELETE FROM public.users WHERE user_id='{{USER_ID}}';\""

  # ── 3. DELETE PER-USER QDRANT COLLECTION ──
  - id: 3_delete_collection
    why: "Remove the derived vector index for this tenant. Leaves faultline-test/-preprod alone."
    command: |
      ssh truenas -x "curl -sS -X DELETE http://localhost:6333/collections/{{COLLECTION}}"

  # ── 4. RESTART MCP + REDIS (clears _provisioned_users + cache) ──
  - id: 4_restart
    why: "MCP restart clears in-memory _provisioned_users so re-provisioning re-fires; redis clears cache."
    command: |
      ssh truenas -x "sudo docker restart faultline-mcp faultline-redis"

# ═══════════════════════════════════════════════════════════════════
# VERIFY (expect: schema gone, public counts 0, collection gone)
# ═══════════════════════════════════════════════════════════════════
verify:
  schema_gone: |
    ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"SELECT count(*) FROM information_schema.schemata WHERE schema_name='{{SCHEMA}}';\""
    # expect 0
  public_rows_gone: |
    ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"SELECT coalesce(sum(n),0) FROM (SELECT (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM public.%I WHERE user_id=%L', c.table_name, '{{USER_ID}}'), false, true, '')))[1]::text::int AS n FROM information_schema.columns c JOIN information_schema.tables t ON t.table_schema='public' AND t.table_name=c.table_name AND t.table_type='BASE TABLE' WHERE c.table_schema='public' AND c.column_name='user_id') s;\""
    # expect 0
  collection_gone: |
    ssh truenas -x "curl -sS http://localhost:6333/collections" | python3 -c "import sys,json;print('{{COLLECTION}}' in [c['name'] for c in json.load(sys.stdin)['result']['collections']])"
    # expect False

# ═══════════════════════════════════════════════════════════════════
# OPTIONAL: confirm a fresh, clean re-provision (confirm_fresh=true)
# ═══════════════════════════════════════════════════════════════════
trigger_fresh_provision:
  - id: fire_recall
    why: "First request after restart enqueues provisioning (~1 min, async)."
    command: |
      ssh truenas -x "curl -sS -X POST http://localhost:8002/recall_memory -H 'Content-Type: application/json' -H 'Authorization: Bearer myownprivateapikey' -H 'X-OpenWebUI-User-Id: {{USER_ID}}' -d '{\"query\":\"hello\",\"user_id\":\"{{USER_ID}}\"}'"
      # expect {"memory":"No relevant facts found."}
  - id: poll_schema
    why: "Wait for the background provisioning job to rebuild the schema, then check seeds."
    command: |
      for i in $(seq 1 24); do
        e=$(ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"SELECT 1 FROM information_schema.schemata WHERE schema_name='{{SCHEMA}}';\"")
        [ "$e" = "1" ] && { echo "schema back after ~$((i*5))s"; break; } || sleep 5
      done
      ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"
      SET search_path TO {{SCHEMA}};
      SELECT 'rel_types='||count(*) FROM rel_types
      UNION ALL SELECT 'extraction_patterns='||count(*) FROM extraction_patterns
      UNION ALL SELECT 'entity_taxonomies='||count(*) FROM entity_taxonomies
      UNION ALL SELECT 'facts='||count(*) FROM facts;\""
      # expect rel_types/extraction_patterns/entity_taxonomies seeded (>0), facts=0

validation_rules:
  - "Run discovery (step 0) and SHOW the targets before any DROP/DELETE — confirm user_id + that you're on truenas pre-prod."
  - "After step 1, re-run verify.public_rows_gone — if the DO block silently no-op'd (docker exec stdin trap or $$ quoting), counts will be non-zero; use fallback_explicit."
  - "Empty recall on the freshly-wiped tenant is CORRECT, not a failure."
  - "If re-provision doesn't fire after ~90s, confirm faultline-mcp actually restarted (sudo docker ps shows recent uptime)."
