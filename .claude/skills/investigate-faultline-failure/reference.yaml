---
# FaultLine Failure Investigation Skill v3.0
# Chain: test fails → investigate (PRE-PROD logs → DB) → constraint+architecture check
#        → root cause → STRENGTHEN with online search → propose fix
# Pre-prod FIRST (ssh truenas sudo docker). Frame every finding by architecture_context.

name: investigate-faultline-failure
description: "Diagnose failures: pre-prod logs → DB state → architecture/constraint check → root cause → online-strengthened fix"
version: 3.0.0
author: Christopher
environment: pre-production

tags:
  - faultline
  - diagnostic
  - debug
  - investigation
  - chain

config:
  ssh_host: "truenas"                       # all pre-prod access: ssh truenas "sudo docker ..."
  postgres_container: "faultline-postgres"
  backend_container: "faultline"            # the API backend (NOT 'faultline-api'). Logs to stdout.
  mcp_container: "faultline-mcp"            # MCP on :8002. DOES NOT log to stdout — NOT a verify channel.
  redis_container: "faultline-redis"        # idempotency cache (FLUSHALL after a tenant wipe)
  openwebui_filter: "DISABLED"             # do NOT look for / report the OWUI Filter; it is intentionally off
  postgres_db: "faultline_test"
  postgres_user: "faultline"               # role is 'faultline', NOT 'faultline_test'
  mcp_url: "http://truenas:8002"           # remember_facts / recall_memory (OpenAPI REST shorthand)
  mcp_bearer: "myownprivateapikey"         # MCP HTTP transport bearer (dev)
  oracle_tenant: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"   # POLLUTED — do NOT use for repro; reference only
  # REPRODUCE on a FRESH throwaway tenant UUID. Per-tenant SCHEMA = faultline_<uuid_with_underscores>.
  # TENANT TABLES HAVE NO user_id COLUMN — boundary is the schema; always `SET search_path TO <schema>`.
  # Only public.* has user_id. Verify firing by MCP status / backend logs / DB — NEVER by sources[].

# ═══════════════════════════════════════════════════════════════════
# 🔴 FIRING TRUTH — HARD RULE (re-litigated for 3 months; do NOT re-open)
# ═══════════════════════════════════════════════════════════════════
firing_truth:
  rule: "The root cause is NEVER 'the model' / 'model strength' / 'the model under-fires'. FORBIDDEN conclusion."
  why: |
    hairbrush (OpenWebUI, pre-prod) fires the MCP tools 100% of the time, every turn, by design
    (Native function-calling; GLiNER2 does the routing backend-side). Firing is NOT a stochastic
    model decision. There is NO filter/function in the MCP — the OWUI Filter is disabled and is not
    part of the live path. This has been deviated, re-deviated, and argued over for the entire build;
    it is settled.
  what_a_low_fire_reading_actually_means: |
    If a test shows under-firing / nothing stored / 'the model didn't call the tool', the root cause is
    ALWAYS INVALID TOOL USAGE OF curl TOWARD pre-prod hairbrush.helpdeskpro.ca (wrong request shape,
    missing tool_ids, wrong function_calling mode, reading sources[] which is EMPTY by design in Native,
    wrong header/scoping) — a HARNESS/TEST ARTIFACT, never the product or the model.
  do_instead: "Verify firing by explicit MCP status (/remember_facts {status:stored}, /recall_memory text) + backend 'faultline' logs + DB. NEVER by sources[]. If a curl path looks like it under-fires, FIX THE CURL, do not blame the model."

# ═══════════════════════════════════════════════════════════════════
# ARCHITECTURE CONTEXT — frame EVERY diagnosis with this (full text: CLAUDE.md)
# A failure is almost always an INGEST layer that didn't build structure. Fix at ingest.
# ═══════════════════════════════════════════════════════════════════
architecture_context:
  l4_ingest_built: "L4 hierarchy is the founding layer, BUILT AT INGEST ('the gateway to how we find shit'). ±6 is an INGEST build-out (up/down, avoid islands), NOT a query bound. Query is a DUMB walk of pre-built L4."
  strong_ingest_lean_query: "If recall is wrong, the bug is at INGEST. Query traverses + presents; it never cleans up/re-validates. Reject any fix that bolts cleanup onto query."
  postgres_authoritative: "Postgres = authoritative long-term (A/B). Qdrant = Class-C-only short-term scratchpad (the FLIP). C lane surfaced first (short-term + promotion gate C→B) but NEVER overrides Postgres A/B. A/B are never vector-served — writing B to Qdrant is a bug."
  subject_agnostic_growable: "Never hardcode subjects/pronouns/rel_types. Lean into the growth engine (miss → grow via /learn, never fail). Self-reference (I/me=user) detected GRAMMATICALLY, not a token list. A fix that hardcodes a subject/keyword is itself a bug."
  ingest_hinges: "All deterministic, all hinge on L4: negation/correction dual-gate = spaCy ∧ LLM (GLiNER2 NEVER judges negation); temporal determination (spaCy DATE NER + dateparser, no LLM tense-guessing; dual-clock event_date vs belief-currency; query recomputes from event_date); growth engine; correction gate (user-is-truth)."
  gliner2_purity: "Pitfall 11 — concise zero-shot type labels only; entity typing not negation/intent zoos. Call it GLiNER2, never 'the LLM'."

# ═══════════════════════════════════════════════════════════════════
# INVESTIGATION ORDER (CRITICAL — follow this sequence; PRE-PROD first)
# ═══════════════════════════════════════════════════════════════════
investigation_order:
  - layer: 1
    name: "Backend logs (PRE-PROD, start here)"
    reason: "The authoritative pipeline channel: classify-intent, extract, ingest, validation, staging, commit, query/walk. Container is 'faultline'. (faultline-mcp does NOT log to stdout; the OWUI Filter is DISABLED — neither is a channel.)"
    command: 'ssh truenas "sudo docker logs faultline --since 30m 2>&1" | grep -iE "classify|extract|ingest\.|class_a|class_b|staged|committed|ground|feel|temporal|negat|anchor|scope|fetch_facts|qdrant|error|crit" | tail -40'

  - layer: 2
    name: "Reproduce on a FRESH tenant via direct MCP"
    reason: "Deterministic repro that sidesteps the model. remember_facts returns explicit status; recall_memory returns the memory text. NEVER judge firing by sources[]."
    command: |
      U="repro-$(date +%s)"; U="cafe0000-0000-4000-8000-$(date +%s | tail -c 13)"
      curl -sS -X POST http://truenas:8002/remember_facts -H "Authorization: Bearer myownprivateapikey" \
        -H "Content-Type: application/json" -H "X-OpenWebUI-User-Id: $U" -d "{\"text\":\"<statement>\",\"user_id\":\"$U\"}"
      curl -sS -X POST http://truenas:8002/recall_memory  -H "Authorization: Bearer myownprivateapikey" \
        -H "Content-Type: application/json" -H "X-OpenWebUI-User-Id: $U" -d "{\"query\":\"<question>\",\"user_id\":\"$U\"}"

  - layer: 3
    name: "Database ground truth (per-tenant — SET search_path)"
    reason: "What actually landed. Tenant tables have NO user_id; the schema IS the boundary."
    # See diagnostic_queries section — every query SETs search_path to faultline_<uuid_underscores>

  - layer: 4
    name: "Constraint + architecture checks"
    reason: "CLAUDE.md hard constraints + architecture_context above."
    # See constraint_checks section

# ═══════════════════════════════════════════════════════════════════
# DIAGNOSTIC QUERIES (PER-TENANT — SET search_path; tenant tables have NO user_id)
# Replace <SCHEMA> with faultline_<uuid_with_underscores> (the repro tenant, NOT the oracle).
# Pattern: ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test
#          -P pager=off -c \"SET search_path TO <SCHEMA>; <SQL>\""
# ═══════════════════════════════════════════════════════════════════
diagnostic_queries:
  # ── Q1: Entity state (aliases per entity) ──
  entity_state: |
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -c \"
    SET search_path TO <SCHEMA>;
    SELECT e.id, e.entity_type, STRING_AGG(ea.alias, ', ' ORDER BY ea.is_preferred DESC) AS aliases
    FROM entities e LEFT JOIN entity_aliases ea ON e.id = ea.entity_id
    GROUP BY e.id, e.entity_type ORDER BY e.id;\""

  # ── Q2: Facts (committed; A/B authoritative — these are NEVER in the vector) ──
  facts_state: |
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -c \"
    SET search_path TO <SCHEMA>;
    SELECT rel_type, fact_class, COUNT(*) AS n, AVG(confidence)::numeric(3,2) AS avg_conf
    FROM facts WHERE superseded_at IS NULL AND archived_at IS NULL AND deleted_at IS NULL
    GROUP BY rel_type, fact_class ORDER BY n DESC;\""

  # ── Q3: Staged facts (B=assumed/inferred, C=short-term; query-visible via fetch_facts_from_anchor) ──
  staged_state: |
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -c \"
    SET search_path TO <SCHEMA>;
    SELECT rel_type, fact_class, confirmed_count, hit_count, confidence,
           (deleted_at IS NOT NULL) AS deleted, expires_at
    FROM staged_facts ORDER BY fact_class, rel_type;\""

  # ── Q4: Scalar attributes (event_date / values at the leaves) ──
  scalar_state: |
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -c \"
    SET search_path TO <SCHEMA>;
    SELECT attribute, value_text, value_int, value_float, value_date, category FROM entity_attributes ORDER BY attribute;\""

  # ── Q5: Temporal stamping (event_date / status; query recomputes from event_date, not the stored stamp) ──
  temporal_state: |
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -c \"
    SET search_path TO <SCHEMA>;
    SELECT rel_type, event_date, temporal_status FROM facts WHERE event_date IS NOT NULL
    UNION ALL SELECT rel_type, event_date, NULL FROM staged_facts WHERE event_date IS NOT NULL ORDER BY 2;\""

  # ── Q6: Rel_type metadata (the ontology the overlay resolves; growth lands here) ──
  rel_type_meta: |
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -c \"
    SET search_path TO <SCHEMA>;
    SELECT rel_type, fact_class, is_hierarchy_rel, tail_types, source, engine_generated FROM rel_types ORDER BY engine_generated DESC, rel_type;\""

  # ── Q7: Vector tier sanity (A/B must NEVER be in Qdrant) — check via re-embedder/Qdrant payloads ──
  vector_tier_check: |
    # Qdrant is on truenas :6333; collection faultline-<user_id>. A/B in the vector = a BUG.
    ssh truenas "curl -sS http://localhost:6333/collections/faultline-<USER_ID>/points/scroll -H 'Content-Type: application/json' -d '{\"limit\":50,\"with_payload\":true}'" | jq '[.result.points[].payload | {fact_class, source_table, rel_type}]'

  # ── Q8: Reproduce + recall via MCP (the honest firing check — NOT sources[]) ──
  mcp_repro: |
    U="cafe0000-0000-4000-8000-$(date +%s | tail -c 13)"
    curl -sS -X POST http://truenas:8002/remember_facts -H "Authorization: Bearer myownprivateapikey" -H "Content-Type: application/json" -H "X-OpenWebUI-User-Id: $U" -d "{\"text\":\"<statement>\",\"user_id\":\"$U\"}"
    curl -sS -X POST http://truenas:8002/recall_memory  -H "Authorization: Bearer myownprivateapikey" -H "Content-Type: application/json" -H "X-OpenWebUI-User-Id: $U" -d "{\"query\":\"<question>\",\"user_id\":\"$U\"}"

# ═══════════════════════════════════════════════════════════════════
# CONSTRAINT CHECKS (CLAUDE.md hard constraints)
# Run EACH under the tenant: `SET search_path TO <SCHEMA>; <query>` (tenant tables have no user_id).
# ═══════════════════════════════════════════════════════════════════
constraint_checks:
  - id: "const-ab-never-in-vector"
    constraint: "A/B facts are NEVER in Qdrant (Postgres-authoritative; vector = Class C only)"
    query: "# inspect Qdrant payloads (vector_tier_check) — any fact_class A or B point = a BUG (e.g. immediate_qdrant_sync_staged writing B)."
    expected: "no A/B points in the vector"

  - id: "const-no-uuid-aliases"
    constraint: "NO UUIDs in entity_aliases"
    query: "SELECT COUNT(*) FROM entity_aliases WHERE alias ~ '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$';"
    expected: "0"

  - id: "const-no-scalars-in-facts"
    constraint: "NO scalar rel_types in facts table"
    query: "SELECT COUNT(*) FROM facts f JOIN rel_types rt ON f.rel_type = rt.rel_type WHERE f.superseded_at IS NULL AND rt.tail_types @> ARRAY['SCALAR']::varchar[];"
    expected: "0"

  - id: "const-all-entities-have-names"
    constraint: "All entities have display names"
    query: "SELECT COUNT(*) FROM entities WHERE id NOT IN (SELECT entity_id FROM entity_aliases);"
    expected: "0"

  - id: "const-metadata-present"
    constraint: "All used rel_types have metadata"
    query: "SELECT COUNT(*) FROM (SELECT DISTINCT rel_type FROM facts UNION SELECT DISTINCT rel_type FROM staged_facts) used LEFT JOIN rel_types rt ON used.rel_type = rt.rel_type WHERE rt.rel_type IS NULL;"
    expected: "0"

  - id: "const-no-uuid-scalar-values"
    constraint: "NO UUID values in scalar attributes"
    query: "SELECT COUNT(*) FROM entity_attributes WHERE value_text ~ '^[0-9a-f]{8}-[0-9a-f]{4}';"
    expected: "0"

# ═══════════════════════════════════════════════════════════════════
# FAILURE PATTERNS (common diagnostic routes)
# ═══════════════════════════════════════════════════════════════════
failure_patterns:

  - pattern: "ZERO / FEW FACTS STORED (alleged 'didn't fire')"
    id: "pattern-no-facts"
    symptom: "facts/staged near-empty after a turn, or 'the tool didn't fire / didn't store'"
    FIRING_TRUTH: "Do NOT conclude 'the model under-fired'. See firing_truth — firing is 100% via hairbrush; a low reading from a curl test = INVALID curl usage toward hairbrush (a test artifact), never the model."
    diagnostic_route:
      - "Reproduce on a FRESH tenant via direct MCP (mcp_repro) → read explicit {status:stored} / recall text. NEVER sources[]."
      - "Run facts_state → if empty, run staged_state → did it land in staging (B/C) instead of facts (A)?"
      - "Run rel_type_meta → is the rel_type known/seeded, or did growth need to mint it?"
      - "Backend 'faultline' logs → classify-intent route, extract output, ingest.* class_a/class_b, gate rejections."
    root_causes:
      - "INVALID curl/test shape toward hairbrush (wrong tool_ids / function_calling / reading sources[]) — fix the test, not the product."
      - "Extraction produced only scalars, no relational edges → check /extract/rewrite + the deterministic/harvest layers."
      - "WGM gate rejected edges → check rel_types type constraints (metadata-driven)."
      - "Ingest didn't build L4 placement → fact has no walkable home (growth/placement gap)."
    next_skill: "skill-propose-faultline-fix → pattern: fix-extraction-relational-gap (AT INGEST, subject-agnostic, no hardcoding)"

  - pattern: "ENTITY SPLIT"
    id: "pattern-entity-split"
    symptom: "Two aliases that should merge (e.g., 'chris' and 'christopher') have different entity_ids"
    diagnostic_route:
      - "Run Q2 (entity_merge_check) → identify split entities"
      - "Run Q1 (entity_state) → see all entities and their aliases"
    root_causes:
      - "EntityRegistry.resolve() creating new entity instead of finding existing one"
      - "alias lookup case-sensitive or missing"
      - "pref_name and also_known_as routed to different entity resolution"
    next_skill: "skill-propose-faultline-fix → pattern: fix-entity-dedup"

  - pattern: "MISSING SCALAR ATTRIBUTES"
    id: "pattern-missing-scalars"
    symptom: "Some ages/names from input are missing from entity_attributes"
    diagnostic_route:
      - "Run Q5 (scalar_state) → compare with test input"
      - "Check Layer 2 logs → look for 'type_mismatch' or 'prerequisite' messages"
    root_causes:
      - "LLM extraction didn't produce triples for all scalars (age annotations in lists)"
      - "Scalar routing failed: value landed in facts instead of entity_attributes"
    next_skill: "skill-propose-faultline-fix → pattern: fix-extraction-coverage"

  - pattern: "ENTITY TYPES UNKNOWN"
    id: "pattern-unknown-types"
    symptom: "Most entities have entity_type='unknown'"
    diagnostic_route:
      - "Run Q6 (entity_type_coverage) → % of unknown entities"
      - "Run Q7 (rel_type_gap) → check if instance_of/subclass_of were used"
    root_causes:
      - "GLiNER2 type inference not running or returning empty"
      - "instance_of facts not being extracted for entities"
      - "entity_type UPDATE in ingest not executing"
    next_skill: "skill-propose-faultline-fix → pattern: fix-type-inference"

# ═══════════════════════════════════════════════════════════════════
# CHAIN
# ═══════════════════════════════════════════════════════════════════
chain:
  triggered_by: "A FaultLine test failure / wrong-or-empty recall / ingest didn't commit / off behavior"
  workflow:
    - "0. Frame with architecture_context + firing_truth (NEVER conclude 'the model')."
    - "1. PRE-PROD backend 'faultline' logs (Layer 1) → what the pipeline actually did."
    - "2. Reproduce on a FRESH tenant via MCP (mcp_repro) → explicit status, NOT sources[]."
    - "3. DB ground truth per-tenant (SET search_path) → facts_state / staged_state / scalar_state / temporal_state."
    - "4. Match symptoms to failure_patterns; run relevant constraint_checks (each under SET search_path)."
    - "5. Name the single failing INGEST link (data/seed/config vs code bug)."
    - "6. STRENGTHEN with online search (solution_validation) → corroborate the fix + library behavior, cite sources."
    - "7. Document: root cause + evidence + corroborated, architecture-respecting fix."
  next: "skill-propose-faultline-fix (fix AT INGEST, subject-agnostic, no hardcoding/fuzzy)"

# ═══════════════════════════════════════════════════════════════════
# SOLUTION VALIDATION — strengthen the fix with ONLINE SEARCH (required before handoff)
# ═══════════════════════════════════════════════════════════════════
solution_validation:
  why: "A root cause is not done until the proposed fix and any library/parser behavior it relies on are corroborated against CURRENT external evidence. This is what makes investigations strong."
  do:
    - "WebSearch for the failure class + the relevant library/best practice (e.g. spaCy dependency labels, dateparser settings, NegEx negation, Qdrant payload filtering, Postgres, KG-memory recall patterns)."
    - "WebFetch the authoritative source (official docs, the library repo, the paper) to VERIFY the exact behavior you are relying on — do not assert from memory."
    - "Cite the URL(s) in the report. State what you VERIFIED online vs inferred."
  guardrails:
    - "Online evidence informs the fix; it does NOT override FaultLine's architecture. A popular pattern that adds fuzzy matching for A/B, hardcodes subjects, or cleans up at query is STILL rejected (architecture_context wins)."
    - "Prefer primary sources (official docs/repo/paper) over blogs; flag any 2026 arXiv id you could not full-text verify."

# ═══════════════════════════════════════════════════════════════════
# QUICK DIAGNOSTIC (run first; REPLACE <SCHEMA>=faultline_<uuid_underscores>, <USER_ID>)
# ═══════════════════════════════════════════════════════════════════
quick_diagnostic:
  description: "One pass: backend logs → per-tenant DB counts → MCP recall. (No Filter; no faultline-api.)"
  command: |
    SCHEMA="faultline_<uuid_with_underscores>"; UID="<uuid>"
    echo "=== BACKEND (faultline) LOGS ==="
    ssh truenas "sudo docker logs faultline --since 20m 2>&1" | grep -iE "classify|ingest\.|class_a|class_b|staged|committed|ground|temporal|negat|error|crit" | tail -15
    echo ""
    echo "=== DB (per-tenant: $SCHEMA) ==="
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc \"SET search_path TO $SCHEMA; SELECT 'facts='||count(*) FROM facts WHERE superseded_at IS NULL AND archived_at IS NULL AND deleted_at IS NULL; SELECT 'staged='||count(*) FROM staged_facts WHERE deleted_at IS NULL; SELECT 'attrs='||count(*) FROM entity_attributes; SELECT 'entities='||count(*) FROM entities;\""
    echo ""
    echo "=== MCP RECALL (honest firing check — NOT sources[]) ==="
    curl -sS -X POST http://truenas:8002/recall_memory -H "Authorization: Bearer myownprivateapikey" -H "Content-Type: application/json" -H "X-OpenWebUI-User-Id: $UID" -d "{\"query\":\"tell me everything you know about me\",\"user_id\":\"$UID\"}"

summary: |
  Frame with architecture_context + firing_truth (NEVER 'the model'). PRE-PROD backend 'faultline'
  logs first → reproduce on a FRESH tenant via MCP (status, not sources[]) → per-tenant DB ground
  truth (SET search_path; no user_id on tenant tables) → match failure_patterns → name the failing
  INGEST link → STRENGTHEN the fix with online search (solution_validation, cite sources) →
  chain to propose-faultline-fix (fix AT INGEST, subject-agnostic, no hardcoding/fuzzy).

documentation:
  usage: |
    /skill investigate-faultline-failure

    Or run quick_diagnostic command directly.
    Match output to failure_patterns section.
    Chain to /skill propose-faultline-fix.
