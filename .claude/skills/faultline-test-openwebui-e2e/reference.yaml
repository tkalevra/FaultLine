---
# FaultLine Live E2E Test Skill (OpenWebUI → MCP)
# Codifies the #1 recurring test mistake: testing the WRONG entrance point.
# The real user path is EP2 (OpenWebUI /api/chat/completions with tool_ids).
# Direct MCP (EP1) tests the pipeline in ISOLATION and bypasses the model layer.

name: faultline-test-openwebui-e2e
description: "Live e2e FaultLine test through the REAL OpenWebUI path (EP2) + direct-MCP isolation path (EP1). Remember a statement, then recall it, and verify by tool_result — never by the model's prose."
version: 1.0.0
author: Christopher
environment: pre-prod
tags:
  - faultline
  - testing
  - openwebui
  - mcp
  - e2e
  - live

# Source of truth (keep in sync if endpoints change)
references:
  - DEV/TEST-openwebui-mcp-e2e-curl.md
  - memory: test-openwebui-mcp-e2e-curl.md

# ── HARD RULES (the lessons this skill exists to enforce) ──────────────────
rules:
  - "DEFAULT to EP2. EP2 is what real users hit; EP1 bypasses the model/tool-calling layer. If the goal is 'does FaultLine work for users', it MUST be EP2."
  - "EP2 fires FaultLine ONLY when tool_ids includes the MCP tool (server:mcp:12 on hairbrush). Without tool_ids it is a plain LLM call — the #1 test mistake. FaultLine silently never fires."
  - "NEVER trust the assistant's prose as proof of ingest. The model narrates 'I'll remember that' even when nothing was stored. Verify via the tool_result JSON in sources[] AND a follow-up recall."
  - "ALWAYS send the per-user header. EP2: X-User-ID. EP1: X-OpenWebUI-User-Id. No resolvable user_id = wrong/empty schema = a TEST error, not a product bug."
  - "⚠️ EP1 CANNOT ISOLATE BY USER (verified 2026-06-13). The REST path IGNORES both the X-OpenWebUI-User-Id header AND the body user_id — it is pinned to FAULTLINE_USER_ID (known multi-tenant isolation gap). A random never-provisioned uuid returns the pinned tenant's data. So EP1 is the pinned tenant ONLY; it can never test a 'throwaway' tenant, and writes to it LAND IN THE PINNED (oracle) TENANT. Use EP2 for any per-tenant behavior. EP1 is for pipeline-vs-model isolation on the ONE pinned tenant, nothing more."
  - "INSPECT/CLEAN the DB directly via SSH (do not give up at host-psql failure): ssh truenas -x \"sudo docker exec faultline-postgres psql -U faultline -d faultline_test -P pager=off -tAc '<SQL>'\"  (role=faultline NOT faultline_test; db=faultline_test; tenant schema=faultline_<uuid-with-underscores>). Verify data state via DB, never infer 'data was reset' from a default-scope recall."
  - "Empty recall on an empty/fresh tenant is CORRECT, not a failure. Confirm the tenant schema exists before calling a miss a bug."
  - "Do NOT print or echo FAULTLINE_TOKEN (OpenWebUI API key). It is a live credential. Reference it as ${FAULTLINE_TOKEN} only."
  - "Do NOT report the OpenWebUI Filter being disabled (is_active=False) as a failure — it is intentionally off; MCP is the live path."

# ── ENDPOINTS ──────────────────────────────────────────────────────────────
config:
  FLUID: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"   # test tenant user uuid
  # EP2 — REAL PATH (OpenWebUI model decides to call the tool)
  ep2_url: "https://hairbrush.helpdeskpro.ca/api/chat/completions"
  ep2_token_env: "FAULTLINE_TOKEN"                  # OpenWebUI API key (Settings > Account) — DO NOT PRINT
  ep2_model: "faultline-test"
  ep2_tool_ids: '["server:mcp:12"]'                 # WITHOUT this, FaultLine never fires
  ep2_user_header: "X-User-ID"
  # EP1 — ISOLATION PATH (MCP server direct; tests pipeline, not the model)
  ep1_base: "http://truenas:8002"
  ep1_bearer: "myownprivateapikey"                  # MCP_API_KEY; bearer now REQUIRED (no bearer → 401)
  ep1_user_header: "X-OpenWebUI-User-Id"

# ── PROCEDURE ────────────────────────────────────────────────────────────────
procedure:
  ep2_real_path:
    remember: |
      # NOTE: the FULL payload is required. A minimal body (model+tool_ids+messages only)
      # makes OpenWebUI return {"detail":"'NoneType' object has no attribute 'startswith'"}.
      # You MUST also send: stream:false, chat_id (uuid), id (uuid), user (the user uuid).
      CHAT=$(cat /proc/sys/kernel/random/uuid); MSG=$(cat /proc/sys/kernel/random/uuid)
      curl -sS -X POST "${FAULTLINE_URL}/api/chat/completions" \
        -H "Authorization: Bearer ${FAULTLINE_TOKEN}" \
        -H "Content-Type: application/json" \
        -H "X-User-ID: ${FLUID}" \
        -d "{\"model\":\"faultline-test\",\"tool_ids\":[\"server:mcp:12\"],\"stream\":false,\"chat_id\":\"${CHAT}\",\"id\":\"${MSG}\",\"user\":\"${FLUID}\",\"messages\":[{\"role\":\"user\",\"content\":\"<STATEMENT>\"}]}"
    recall: |
      # same call, content = a recall question. Then VERIFY, do not read the prose:
      #  - sources[].source.name == "12_remember_facts" / "12_recall_memory"
      #  - that block's "tool_result": true
      #  - the tool's JSON in document[]  (this is the ground truth)
    verify_checklist:
      - "A tool block exists in sources[] (proves FaultLine was actually called, not just narrated)."
      - "tool_result == true."
      - "The remembered fact appears in a follow-up recall's tool JSON."
  ep1_isolation_path:
    remember: |
      curl -sS -X POST http://truenas:8002/remember_facts \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${KEY}" \
        -H "X-OpenWebUI-User-Id: ${FLUID}" \
        -d "{\"text\":\"<STATEMENT>\",\"user_id\":\"${FLUID}\"}"
    recall: |
      curl -sS -X POST http://truenas:8002/recall_memory \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${KEY}" \
        -H "X-OpenWebUI-User-Id: ${FLUID}" \
        -d "{\"query\":\"<Q>\",\"user_id\":\"${FLUID}\"}"
    use_when: "Isolating the FaultLine pipeline from the model layer (e.g. 'did the model send empty args' vs 'did ingest break'). NOT a substitute for EP2."

# ── POST-REBUILD SEQUENCE (run after every deploy) ───────────────────────────
post_rebuild:
  - "Restart the MCP container to clear the in-memory _provisioned_users set — or re-provisioning will not re-fire after a tenant wipe."
  - "Confirm the auth/deploy landed: curl -sS http://truenas:8002/openapi.json | python3 -c \"import sys,json;print(json.load(sys.stdin)['components']['securitySchemes'])\"  → expect HTTPBearer."
  - "Then run the EP2 remember+recall smoke test above before declaring the build good."

# ── REPORTING ────────────────────────────────────────────────────────────────
reporting:
  - "Report actual pass/fail with the tool_result JSON, not the model prose."
  - "If a recall misses, state which lane (DB-direct vs Qdrant) and whether the tenant schema/data exists — do not assume a code bug."
