---
# FaultLine Retractions Test Skill
# Tests fact removal via retraction mechanism
# Chainable: run after test-faultline-corrections
# Use: /skill test-faultline-retractions

name: test-faultline-retractions
description: "Test retraction flow (forget/delete) and hierarchy impact"
version: 1.0.0
author: Christopher

tags:
  - faultline
  - retraction
  - delete
  - hierarchy

config:
  openwebui_url: "https://hairbrush.helpdeskpro.ca"
  bearer_token: "sk-a2d41543706140fbae32088110d9f0cf"
  model_name: "faultline-test"
  truenas_ssh: "ssh truenas -x"
  database_user: "faultline"
  database_name: "faultline_test"
  postgres_container: "faultline-postgres"

steps:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 1: VERIFY PETS EXIST BEFORE RETRACTION
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Verify has_pet relationship exists"
    id: "step-verify-pet-exists"
    description: "Check that Mars→Fraggle has_pet relationship is in DB"
    sql_query: |
      SELECT
        COUNT(*) as has_pet_count,
        array_agg(DISTINCT rel_type) as rel_types
      FROM facts
      WHERE rel_type = 'has_pet'
        AND subject_id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'mars'
        );
    expected:
      has_pet_count: 1
    on_failure: "STOP: has_pet relationship not found. Run test-pipeline-transparent first."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 2: SEND RETRACTION ("forget pets")
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Retraction: We don't have any pets"
    id: "step-retraction-pets"
    description: "User retracts pet fact via forget signal"
    payload: |
      {
        "model": "faultline-test",
        "messages": [
          {
            "role": "user",
            "content": "Sorry, we actually don't have any pets"
          }
        ],
        "stream": false
      }
    curl_command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{PAYLOAD}' | jq '.'
    validations:
      - type: "http_status"
        expected: 200
        on_failure: "STOP: OpenWebUI returned error."
      - type: "response_field"
        field: "choices[0].message.content"
        should_contain_one_of: ["understood", "removed", "deleted", "forget"]
        on_failure: "INFO: Response doesn't confirm deletion (may be handled silently)."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 3: VALIDATE RETRACTION IN DB
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate has_pet fact superseded"
    id: "step-validate-pet-removed"
    description: "Check that has_pet facts are marked superseded_at (soft-delete)"
    sql_query: |
      SELECT
        rel_type,
        COUNT(*) as count,
        COUNT(CASE WHEN superseded_at IS NOT NULL THEN 1 END) as superseded_count,
        COUNT(CASE WHEN superseded_at IS NULL THEN 1 END) as active_count
      FROM facts
      WHERE rel_type = 'has_pet'
      GROUP BY rel_type;
    expected:
      superseded_count_min: 1
      active_count: 0
    on_failure: "STOP: has_pet facts not superseded. Check retraction gate."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 4: VALIDATE QDRANT SYNCED
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate Qdrant sync flag set"
    id: "step-validate-qdrant-sync"
    description: "Check that superseded facts have qdrant_synced=false for cleanup"
    sql_query: |
      SELECT
        COUNT(*) as total_superseded,
        COUNT(CASE WHEN qdrant_synced = false THEN 1 END) as needs_sync,
        COUNT(CASE WHEN qdrant_synced = true THEN 1 END) as already_synced
      FROM facts
      WHERE rel_type = 'has_pet'
        AND superseded_at IS NOT NULL;
    expected:
      needs_sync_min: 1
    on_failure: "INFO: Qdrant sync flag may not be set (not critical)."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 5: VERIFY QUERY EXCLUDES SUPERSEDED FACTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Verify active facts don't include has_pet"
    id: "step-verify-active-facts"
    description: "Check that /query returns only non-superseded facts"
    sql_query: |
      SELECT
        rel_type,
        COUNT(*) as count
      FROM facts
      WHERE superseded_at IS NULL
      GROUP BY rel_type
      ORDER BY rel_type;
    expected:
      has_pet_count: 0
    on_failure: "STOP: Active query still returns superseded has_pet. Check /query filter."

summary:
  success: |
    ✅ RETRACTIONS TEST PASSED
    - has_pet facts marked superseded_at (soft-delete, not hard-delete)
    - Qdrant sync flagged for cleanup
    - Active query excludes superseded facts
    - No data loss, audit trail preserved
  failure: |
    ❌ RETRACTIONS TEST FAILED
    See STOP messages above for exact failure point.
    Next step: Run /skill investigate-faultline-failure

chainable_next:
  - "/skill test-faultline-name-changes"
  - "/skill investigate-faultline-failure"
