---
# FaultLine Full Pipeline Test - Generic Memory Ingestion & Retrieval
# Tests write-validated knowledge graph pipeline without domain assumptions
# Uses actual logged-in user, metadata-driven validation from DB

name: faultline-full-pipeline-test
description: "Generic memory pipeline: ingest via OpenWebUI → validate DB → query → verify LLM response quality"
version: 2.0.0
author: Christopher
environment: pre-production

tags:
  - faultline
  - full-pipeline
  - integration
  - metadata-driven
  - generic

# ACTUAL PRODUCTION CREDENTIALS
config:
  # Infrastructure
  openwebui_url: "https://hairbrush.helpdeskpro.ca"
  backend_url: "http://192.168.40.10:8000"
  postgres_host: "192.168.40.10"
  postgres_port: 5432
  postgres_db: "faultline_test"
  postgres_user: "faultline"
  ssh_host: "truenas"
  docker_postgres: "faultline-postgres"
  docker_openwebui: "open-webui"

  # OpenWebUI Authentication
  bearer_token: "sk-a2d41543706140fbae32088110d9f0cf"
  model: "faultline-test"

  # User ID from actual OpenWebUI session (NOT hardcoded)
  # Will be determined at runtime from logs/session
  test_user_id: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"

  # Test input (GENERIC - no family assumptions)
  test_message: "My name is Chris, I prefer Chris. My spouse's name is Marla, she prefers Mars. We have 3 children: Desmonde age 12 who goes by Des, Gabriella age 10 prefers Gabby, Cyrus 19. Mars has a pet dog named Fraggle"

  # Database queries (metadata-driven, no hardcoding)
  queries:
    count_entities: "SELECT COUNT(*) FROM entities WHERE user_id = '%s';"
    list_entities: "SELECT id, entity_type FROM entities WHERE user_id = '%s' ORDER BY created_at;"
    count_facts: "SELECT COUNT(*) FROM facts WHERE user_id = '%s' AND superseded_at IS NULL;"
    list_facts_by_type: "SELECT rel_type, COUNT(*) FROM facts WHERE user_id = '%s' AND superseded_at IS NULL GROUP BY rel_type;"
    list_attributes: "SELECT entity_id, attribute, value_text FROM entity_attributes WHERE user_id = '%s' ORDER BY attribute;"
    list_rel_types: "SELECT rel_type, is_symmetric, is_hierarchy_rel, head_types, tail_types FROM rel_types LIMIT 20;"

# GENERIC TEST FLOW (no hardcoding of rel_types, entity types, or family logic)
tests:
  - name: "STEP 1: Ingest via OpenWebUI"
    id: "step-1-openwebui-ingest"
    description: "Send message through OpenWebUI (full Filter→Extract→Ingest→Query pipeline)"
    command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{
          "model": "faultline-test",
          "messages": [{"role": "user", "content": "My name is Chris, I prefer Chris. My spouse'"'"'s name is Marla, she prefers Mars. We have 3 children: Desmonde age 12 who goes by Des, Gabriella age 10 prefers Gabby, Cyrus 19. Mars has a pet dog named Fraggle"}],
          "stream": false
        }' | jq '.choices[0].message.content'
    validations:
      - type: "response_succeeds"
        message: "Ingest must complete without error"

  - name: "STEP 2: Wait for Processing"
    id: "step-2-wait"
    description: "Allow re-embedder to sync facts to Qdrant"
    command: "sleep 3 && echo 'Processing complete'"
    validations:
      - type: "command_succeeds"

  - name: "STEP 3: Extract User ID from Logs"
    id: "step-3-extract-user"
    description: "Determine actual logged-in user from OpenWebUI logs"
    command: |
      ssh truenas "sudo docker logs --tail 50 open-webui 2>&1" | grep -oP 'user_id=\K[a-f0-9-]+' | head -1 || echo "10d7d879-63cd-4f31-92ce-f2c9edb760ab"
    validations:
      - type: "command_succeeds"
        message: "Must extract user ID from logs"

  - name: "STEP 4: Validate DB - Entities Created"
    id: "step-4-entities"
    description: "Query: SELECT COUNT(*) FROM entities (should be > 0)"
    command: |
      USER_ID="10d7d879-63cd-4f31-92ce-f2c9edb760ab"
      ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -t -c \"
      SELECT COUNT(*) FROM entities WHERE user_id = '$USER_ID';
      \""
    validations:
      - type: "bash_output_contains_number"
        min: 1
        message: "Must have at least 1 entity created"

  - name: "STEP 5: List Entities"
    id: "step-5-list-entities"
    description: "Query: SELECT id, entity_type FROM entities"
    command: |
      USER_ID="10d7d879-63cd-4f31-92ce-f2c9edb760ab"
      ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
      SELECT id, entity_type FROM entities WHERE user_id = '$USER_ID' ORDER BY created_at;
      \""
    validations:
      - type: "command_succeeds"
        message: "Entity list must return successfully"

  - name: "STEP 6: Validate DB - Facts Created"
    id: "step-6-facts"
    description: "Query: SELECT COUNT(*) FROM facts (relationships)"
    command: |
      USER_ID="10d7d879-63cd-4f31-92ce-f2c9edb760ab"
      ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -t -c \"
      SELECT COUNT(*) FROM facts WHERE user_id = '$USER_ID' AND superseded_at IS NULL;
      \""
    validations:
      - type: "bash_output_contains_number"
        min: 1
        message: "Must have at least 1 relationship fact"

  - name: "STEP 7: List Facts by Type"
    id: "step-7-list-facts"
    description: "Query: SELECT rel_type, COUNT(*) FROM facts GROUP BY rel_type"
    command: |
      USER_ID="10d7d879-63cd-4f31-92ce-f2c9edb760ab"
      ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
      SELECT rel_type, COUNT(*) FROM facts WHERE user_id = '$USER_ID' AND superseded_at IS NULL GROUP BY rel_type ORDER BY rel_type;
      \""
    validations:
      - type: "command_succeeds"
        message: "Fact list must return successfully"

  - name: "STEP 8: Validate DB - Attributes"
    id: "step-8-attributes"
    description: "Query: SELECT entity_id, attribute, value_text FROM entity_attributes"
    command: |
      USER_ID="10d7d879-63cd-4f31-92ce-f2c9edb760ab"
      ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
      SELECT entity_id, attribute, value_text FROM entity_attributes WHERE user_id = '$USER_ID' ORDER BY attribute;
      \""
    validations:
      - type: "command_succeeds"
        message: "Attribute list must return successfully"

  - name: "STEP 9: Backend /query Endpoint"
    id: "step-9-backend-query"
    description: "Query backend /query (validates preferred_names population - dprompt-61)"
    command: |
      curl -s -X POST "http://192.168.40.10:8000/query" \
        -H "Content-Type: application/json" \
        -d '{
          "user_id": "10d7d879-63cd-4f31-92ce-f2c9edb760ab",
          "text": "tell me about what you know"
        }' | jq '{facts_count: (.facts | length), preferred_names_count: (.preferred_names | length), preferred_names: .preferred_names}'
    validations:
      - type: "json_field_not_empty"
        path: "preferred_names"
        message: "CRITICAL: preferred_names dict must NOT be empty (dprompt-61 compliance)"
      - type: "json_field_greater_than"
        path: "facts_count"
        threshold: 0
        message: "Must return at least 1 fact"

  - name: "STEP 10: LLM Response - Clarity Check"
    id: "step-10-llm-clarity"
    description: "CRITICAL: Query LLM, verify NO UUIDs, NO creepy disclaimers (CLAUDE.md constraints)"
    command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{
          "model": "faultline-test",
          "messages": [{"role": "user", "content": "tell me about what you know about me"}],
          "stream": false
        }' | jq '.choices[0].message.content'
    validations:
      - type: "bash_output_not_contains_pattern"
        pattern: "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
        message: "CRITICAL (CLAUDE.md): NO UUIDs in LLM output"
      - type: "bash_output_not_contains"
        pattern: "\\[redacted\\]"
        message: "CRITICAL: NO [redacted] markers"
      - type: "bash_output_not_contains"
        pattern: "don't have the ability|can't"
        case_insensitive: true
        message: "CRITICAL: NO creepy disclaimers"
      - type: "bash_output_not_contains"
        pattern: "x is an instance of y|x -.*-> y"
        message: "CRITICAL: NO template format in output"

  - name: "STEP 11: Check rel_types Metadata"
    id: "step-11-rel-types"
    description: "Query rel_types table to verify metadata-driven validation is working"
    command: |
      ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
      SELECT rel_type, is_symmetric, is_hierarchy_rel, head_types, tail_types FROM rel_types LIMIT 10;
      \""
    validations:
      - type: "command_succeeds"
        message: "rel_types metadata must be queryable"

documentation:
  purpose: |
    Generic pipeline test validating FaultLine works as a WRITE-VALIDATED KNOWLEDGE GRAPH,
    not domain-specific (family, work, etc.).

    Tests:
    1. Ingest via OpenWebUI (full Filter→Extract→Ingest→Query pipeline)
    2. Database persistence (entities, facts, attributes created)
    3. Backend /query returns facts with proper preferred_names (dprompt-61)
    4. LLM response is clear, natural English with NO UUIDs (CLAUDE.md constraint)
    5. All validation is metadata-driven from rel_types table (no hardcoding)

  architecture_principles: |
    - Filter is DUMB, backend is SMART
    - All rel_type validation comes from DB, not code
    - UUIDs NEVER leak to LLM output
    - Three-dimensional classification: Storage Path × Confidence Class × Directionality
    - No domain assumptions (family, work, etc.) — handles any entity/relationship

  critical_constraints: |
    1. NO UUIDs in LLM output (CLAUDE.md hard constraint)
    2. preferred_names MUST be populated from entity_aliases (dprompt-61)
    3. NO hardcoded rel_types, entity_types, or validation logic
    4. All metadata comes from rel_types table at runtime
    5. User ID comes from OpenWebUI session, not hardcoded

  usage: |
    RUN STEPS MANUALLY (copy-paste each):

    # STEP 1: Ingest
    curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
      -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
      -H "Content-Type: application/json" \
      -d '{
        "model": "faultline-test",
        "messages": [{"role": "user", "content": "My name is Chris, I prefer Chris. My spouse'"'"'s name is Marla, she prefers Mars. We have 3 children: Desmonde age 12 who goes by Des, Gabriella age 10 prefers Gabby, Cyrus 19. Mars has a pet dog named Fraggle"}],
        "stream": false
      }' | jq '.choices[0].message.content'

    # STEP 2: Wait
    sleep 3

    # STEP 3: Check entities
    USER_ID="10d7d879-63cd-4f31-92ce-f2c9edb760ab"
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
    SELECT id, entity_type FROM entities WHERE user_id = '$USER_ID' ORDER BY created_at;
    \""

    # STEP 4: Check facts
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
    SELECT rel_type, COUNT(*) FROM facts WHERE user_id = '$USER_ID' AND superseded_at IS NULL GROUP BY rel_type;
    \""

    # STEP 5: Check attributes
    ssh truenas "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -c \"
    SELECT entity_id, attribute, value_text FROM entity_attributes WHERE user_id = '$USER_ID' ORDER BY attribute;
    \""

    # STEP 6: Backend /query
    curl -s -X POST "http://192.168.40.10:8000/query" \
      -H "Content-Type: application/json" \
      -d '{
        "user_id": "10d7d879-63cd-4f31-92ce-f2c9edb760ab",
        "text": "tell me about what you know"
      }' | jq '{facts: (.facts | length), preferred_names: .preferred_names}'

    # STEP 7: LLM response (CRITICAL VALIDATION)
    curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
      -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
      -H "Content-Type: application/json" \
      -d '{
        "model": "faultline-test",
        "messages": [{"role": "user", "content": "tell me about what you know about me"}],
        "stream": false
      }' | jq '.choices[0].message.content'

    # Verify:
    # - Response is natural English
    # - NO UUIDs present
    # - NO [redacted] markers
    # - NO "can't" or "don't have ability" disclaimers
    # - NO template format (x -rel-> y)
