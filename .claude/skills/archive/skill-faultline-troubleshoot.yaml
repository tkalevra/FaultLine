---
# FaultLine Troubleshooting & Investigation Skill
# Universal methodology for diagnosing pipeline issues
# Enforces correct test flow: Full Pipeline → Log Inspection → Root Cause

name: faultline-troubleshoot
description: Universal FaultLine troubleshooting skill - test full pipeline via hairbrush, investigate logs
version: 1.0.0
author: Christopher
environment: pre-production

tags:
  - faultline
  - troubleshooting
  - investigation
  - debugging
  - pipeline
  - diagnostics

# ═══════════════════════════════════════════════════════════════════
# CRITICAL CONSTRAINTS (Enforce These Always)
# ═══════════════════════════════════════════════════════════════════

constraints:
  - name: "Test via Full Pipeline Only"
    description: "NEVER test by hitting FaultLine backend directly (http://192.168.40.10:8000). Always test via hairbrush OpenWebUI (full Filter → Backend → Database flow)"
    reason: "Direct backend tests miss Filter behavior, UUID guard, fact injection, memory formatting. Filter is where value lives."
    enforcement: "All tests use https://hairbrush.helpdeskpro.ca/api/chat/completions endpoint only"

  - name: "Log Inspection Order"
    description: "Always inspect logs in this sequence: OpenWebUI → FaultLine → Postgres"
    reason: "Logs show request flow: Filter receives/rejects → Backend processes/validates → Database commits. Order reveals where failure occurs."
    enforcement: "Use SSH: truenas -x 'sudo docker logs <container>' in sequence, not random"

  - name: "Code Changes in Dev Only"
    description: "All code modifications happen in /home/chris/Documents/013-GIT/FaultLine-dev/, never in production containers"
    reason: "Separation of dev code and runtime ensures reproducibility and prevents accidental overwrites"
    enforcement: "Edit files in dev, request user rebuild/redeploy when ready (wait for completion before testing)"

  - name: "Wait for Rebuild/Redeploy"
    description: "STOP and WAIT after requesting container rebuild. Do not test until user confirms 'rebuilt' or 'redeployed'"
    reason: "Testing before rebuild runs old code. Wasted investigation effort and false negatives."
    enforcement: "Add explicit marker: '⏸️  WAITING FOR REBUILD' in response, block all further action"

  - name: "Filter Updates Don't Need Rebuild"
    description: "Code changes to Filter (openwebui/faultline*.py) are live immediately. No rebuild needed. Just request user 'update filter and test'"
    reason: "Filter runs in OpenWebUI runtime, picked up on next request. Backend rebuild only needed for src/api/main.py changes"
    enforcement: "If editing openwebui/*, say 'Update Filter and test' not 'rebuild container'"

# ═══════════════════════════════════════════════════════════════════
# UNIVERSAL TEST FLOW
# ═══════════════════════════════════════════════════════════════════

test_methodology:
  phase_1_full_pipeline_test:
    description: "Test via hairbrush (full Filter → Backend → Database flow)"
    tool: "curl"
    endpoint: "https://hairbrush.helpdeskpro.ca/api/chat/completions"
    credentials:
      bearer_token: "sk-a2d41543706140fbae32088110d9f0cf"
      model: "faultline-test"
      test_user_id: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"
    example_command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{
          "model": "faultline-test",
          "messages": [{"role": "user", "content": "YOUR TEST MESSAGE HERE"}],
          "stream": false
        }' | jq -r '.choices[0].message.content'

  phase_2_log_inspection:
    description: "Investigate what happened using SSH logs (in sequence)"
    order:
      - step: "1. OpenWebUI Filter Logs (inlet/outlet, /query calls, fact injection)"
        command: "ssh truenas -x \"sudo docker logs open-webui --tail=200 2>&1\""
        look_for: "[FaultLine Filter] inlet CALLED, /query status, /ingest called, uuid_guard, facts filtered, INJECTED total_messages"

      - step: "2. FaultLine Backend Logs (extraction, validation, staging, commitment)"
        command: "ssh truenas -x \"sudo docker logs faultline --tail=300 2>&1\""
        look_for: "ingest.call_start, type_mismatch, prerequisite_extracted, prerequisite_staged, class_a_committed, class_b_staged"

      - step: "3. Postgres Logs (if needed for constraint errors)"
        command: "ssh truenas -x \"sudo docker logs faultline-postgres --tail=100 2>&1\""
        look_for: "INSERT, UPDATE, CONFLICT, ERROR"

  phase_3_database_validation:
    description: "Query database directly to verify facts were committed (only AFTER logs show success)"
    tool: "curl"
    endpoint: "http://192.168.40.10:8000/query"
    note: "Backend /query only, not Filter. Use to verify facts exist in DB."
    example_command: |
      curl -s -X POST "http://192.168.40.10:8000/query" \
        -H "Content-Type: application/json" \
        -d '{
          "user_id": "10d7d879-63cd-4f31-92ce-f2c9edb760ab",
          "text": "YOUR QUERY TEXT"
        }' | jq '.facts | map({subject, rel_type, object, confidence, fact_class})'

# ═══════════════════════════════════════════════════════════════════
# FRICTION POINTS FROM PREVIOUS DEBUGGING (Learn From These)
# ═══════════════════════════════════════════════════════════════════

friction_log:
  issue_1:
    title: "Testing backend directly instead of full pipeline"
    symptom: "Facts appeared in /query response but weren't being injected into LLM"
    root_cause: "Backend returned correct data, but Filter had network issues or UUID guard was filtering facts"
    lesson: "Always test via hairbrush first. Only use backend /query for verification AFTER Filter test works"

  issue_2:
    title: "Prerequisite type matching was exact-string based"
    symptom: "Prerequisite extraction triggered (type_mismatch logged) but no prerequisites staged"
    root_cause: "Regex matched required_types=['Animal'] but extracted_types=['bunny']. No exact match."
    lesson: "Accept ANY extracted type, don't enforce exact match to required_types. Semantic correctness is in presence of type, not name match."
    fix: "Changed to: if extracted_types: matched_type = list(extracted_types)[0]"

  issue_3:
    title: "GLiNER2 model unavailable at runtime"
    symptom: "Prerequisite extraction returned empty list silently"
    root_cause: "Function checked 'if not gliner_model' and returned [] early. Model was None."
    lesson: "Provide fallback when optional dependencies unavailable. Use regex-based extraction instead."
    fix: "Added regex patterns as fallback: 'a dog named X', 'X is a dog', 'your hamster named X'"

  issue_4:
    title: "Only checking backend logs, missing Filter behavior"
    symptom: "Backend logs showed type_mismatch being handled, but facts weren't injected"
    root_cause: "OpenWebUI Filter was filtering facts based on UUID guard or other rules"
    lesson: "Check OpenWebUI logs FIRST. It's the entry point. Backend logs come second."

  issue_5:
    title: "Asking for rebuilds/redeploys before code was ready"
    symptom: "Wasted redeploys on incomplete changes"
    root_cause: "Testing incremental changes required multiple rebuild cycles"
    lesson: "Complete code locally, review logs thoroughly, THEN request rebuild once (wait for completion)"

  issue_6:
    title: "Forgetting Filter updates don't need rebuilds"
    symptom: "Requested rebuild for openwebui/faultline_function.py changes"
    root_cause: "Filter code is live in OpenWebUI runtime, not in FaultLine container"
    lesson: "Filter changes are immediate. Only request rebuild for src/api/main.py changes."

# ═══════════════════════════════════════════════════════════════════
# DIAGNOSTIC CHECKLIST (Use This for Any Issue)
# ═══════════════════════════════════════════════════════════════════

diagnostic_checklist:
  - name: "Message reached Filter"
    command: "ssh truenas -x \"sudo docker logs open-webui --tail=100 2>&1\" | grep 'inlet CALLED\\|user_id='"
    expect: "[FaultLine Filter] inlet CALLED ... user_id=10d7d879..."
    if_missing: "Filter not receiving requests. Check hairbrush connectivity or token."

  - name: "Filter called /query"
    command: "ssh truenas -x \"sudo docker logs open-webui --tail=100 2>&1\" | grep '/query\\|status='"
    expect: "[FaultLine Filter] /query status=200"
    if_missing: "Backend unreachable from Filter. Check http://192.168.40.10:8000 connectivity."

  - name: "Facts were extracted"
    command: "ssh truenas -x \"sudo docker logs faultline --tail=200 2>&1\" | grep 'ingest.call_start\\|extracted_edges'"
    expect: "ingest.call_start ... call_count=N has_text=True"
    if_missing: "Extraction pipeline didn't run. Check if LLM responded."

  - name: "Validation was performed"
    command: "ssh truenas -x \"sudo docker logs faultline --tail=200 2>&1\" | grep 'type_mismatch\\|valid'"
    expect: "ingest.type_mismatch or ingest.fact_classified confidence="
    if_missing: "WGM gate didn't run. Check extraction produced valid edges."

  - name: "Prerequisites were extracted (if type_mismatch occurred)"
    command: "ssh truenas -x \"sudo docker logs faultline --tail=200 2>&1\" | grep 'prerequisite'"
    expect: "ingest.prerequisite_extracted or ingest.prerequisite_staged"
    if_missing: "Prerequisite extraction failed. Check regex patterns or entity name matching."

  - name: "Facts were committed"
    command: "ssh truenas -x \"sudo docker logs faultline --tail=200 2>&1\" | grep 'class_a_committed\\|class_b_staged'"
    expect: "ingest.class_a_committed count=N or ingest.class_b_staged count=N"
    if_missing: "Facts were rejected/skipped. Check WGM validation reason."

  - name: "Filter injected facts (memory)"
    command: "ssh truenas -x \"sudo docker logs open-webui --tail=100 2>&1\" | grep 'INJECTED\\|facts filtered'"
    expect: "[FaultLine Filter] INJECTED total_messages=3"
    if_missing: "Facts not injected. Check uuid_guard skips, preferred_names population."

  - name: "Database persisted facts"
    command: "curl -s -X POST 'http://192.168.40.10:8000/query' -H 'Content-Type: application/json' -d '{\"user_id\":\"10d7d879-63cd-4f31-92ce-f2c9edb760ab\",\"text\":\"check\"}' | jq '.facts | length'"
    expect: "number > 0"
    if_missing: "Database query returned no facts. Check if ingest actually committed."

# ═══════════════════════════════════════════════════════════════════
# COMMON INVESTIGATION PATTERNS
# ═══════════════════════════════════════════════════════════════════

patterns:
  pattern_1:
    name: "Facts extracted but not appearing in memory injection"
    check_order:
      - "Does Filter see facts from /query? (OpenWebUI logs)"
      - "Does Filter uuid_guard filter them? (grep uuid_guard in logs)"
      - "Are preferred_names populated? (check if UUIDs are resolving to display names)"

  pattern_2:
    name: "Type validation failing but prerequisite extraction not triggering"
    check_order:
      - "Is type_mismatch status being set? (grep ingest.type_mismatch in logs)"
      - "Is req.edges empty? (check has_edges=False in ingest.call_start)"
      - "Is prerequisite extraction being called? (grep prerequisite in logs)"
      - "Is gliner_model available or regex fallback working? (check extraction method)"

  pattern_3:
    name: "Prerequisites staged but original fact still failing"
    check_order:
      - "Were prerequisites actually staged? (grep ingest.prerequisite_staged in logs)"
      - "Did re-validation pass? (check log after staging)"
      - "Are staged facts visible to /query? (check if staged_facts UNION working)"

# ═══════════════════════════════════════════════════════════════════
# NOTES FOR FUTURE DEBUGGING
# ═══════════════════════════════════════════════════════════════════

database:
  name: "faultline_test"
  important_tables:
    - "facts: committed relationship facts (fact_class A/B/C)"
    - "staged_facts: Class B/C facts awaiting promotion/expiry"
    - "entity_attributes: scalar facts (pref_name, age, etc.)"
    - "entities: entity registry"
    - "entity_aliases: display names for entities"
    - "rel_types: ontology metadata (tail_types, is_symmetric, etc.)"

workflow_summary: |
  1. Test full pipeline via hairbrush (curl)
  2. Check OpenWebUI logs for Filter behavior
  3. Check FaultLine logs for backend processing
  4. Check Postgres logs only if constraint errors
  5. Verify facts in DB via /query endpoint
  6. Compare what Filter injected vs what was in /query
  7. Use friction points to form hypothesis about root cause
  8. Make code fix in dev directory
  9. Request rebuild/redeploy (WAIT for completion)
  10. Re-test with same test case

remember: |
  - Full pipeline > backend only
  - Logs in order: OpenWebUI → FaultLine → Postgres
  - Code in dev directory
  - Wait for rebuilds
  - Filter updates are live immediately
  - Include friction points in investigation
