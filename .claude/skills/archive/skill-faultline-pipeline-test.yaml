---
# FaultLine Comprehensive Pipeline Validation Skill
# Production-grade end-to-end testing of knowledge graph pipeline
# Validates extraction, validation, storage, retrieval, and injection

name: faultline-pipeline-test
description: Enterprise-grade comprehensive FaultLine pipeline validation (15+ tests)
version: 2.0.0
author: Christopher
environment: pre-production

tags:
  - faultline
  - testing
  - validation
  - pipeline
  - integration
  - production-ready

config:
  openwebui_url: "https://hairbrush.helpdeskpro.ca"
  backend_url: "http://192.168.40.10:8000"
  bearer_token: "sk-a2d41543706140fbae32088110d9f0cf"
  model_name: "faultline-test"
  test_user:
    id: "10d7d879-63cd-4f31-92ce-f2c9edb760ab"
    name: "christopher"

  # TrueNAS infrastructure access
  truenas:
    ssh_host: "truenas"
    ssh_pattern: "ssh truenas -x"
    database_name: "faultline_test"
    database_user: "faultline"
    docker_containers:
      openwebui: "open-webui"
      backend: "faultline-api"
      postgres: "faultline-postgres"

  # Diagnostic configuration for Filter visibility
  diagnostics:
    truenas_ssh_command: "ssh truenas -x \"sudo docker logs open-webui --tail=100 -f\""
    purpose: "OpenWebUI logs show Filter inlet/outlet behavior, /query calls, fact injection"
    when_to_use: "Always check OpenWebUI logs when testing memory injection - curl tests backend only, not Filter flow"

tests:
  # ═══════════════════════════════════════════════════════════════════
  # LAYER 1: Backend Initialization & Data Integrity
  # ═══════════════════════════════════════════════════════════════════

  - name: "Backend Health Check"
    id: "test-backend-health"
    description: "Verify backend is responding and database is healthy"
    endpoint: "GET /health"
    validations:
      - type: "http_status"
        value: 200
        message: "Backend must be healthy"
      - type: "object_not_empty"
        path: "."
        message: "Health endpoint must return data"

  - name: "Backend preferred_names Population"
    id: "test-preferred-names-population"
    description: "Verify /query returns complete preferred_names dict with all entities"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "all relationships"
    validations:
      - type: "object_not_empty"
        path: "preferred_names"
        message: "preferred_names must not be empty"
      - type: "count_greater_than"
        path: "preferred_names"
        threshold: 5
        message: "Must map 5+ entities to display names"
      - type: "object_contains_key"
        path: "preferred_names"
        key: "${test_user.id}"
        message: "User entity MUST be in preferred_names (dBug-user-entity-preferred-name-skipped fix)"

  - name: "Facts Table Integrity"
    id: "test-facts-integrity"
    description: "Verify facts are properly classified (Class A/B/C) and have required metadata"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "family"
    validations:
      - type: "count_greater_than"
        path: "facts"
        threshold: 10
        message: "Must return 10+ facts"
      - type: "object_contains_all_keys"
        path: "facts[0]"
        keys: ["subject", "object", "rel_type", "confidence", "fact_class"]
        message: "Facts must have required metadata fields"
      - type: "response_field_values"
        path: "facts[*].fact_class"
        values: ["A", "B", "C"]
        message: "Fact classification must be A, B, or C"

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 2: UUID Resolution & Display Name Mapping
  # ═══════════════════════════════════════════════════════════════════

  - name: "UUID→Display Name Resolution (Hard Constraint)"
    id: "test-uuid-display-name-mapping"
    description: "Verify NO UUIDs leak through preferred_names dict to Filter"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "relationships"
    validations:
      - type: "no_uuid_values"
        path: "preferred_names"
        message: "preferred_names values must be display names, NEVER UUIDs (CLAUDE.md constraint)"
      - type: "response_field_pattern"
        path: "preferred_names"
        pattern: "[a-z0-9]+"
        message: "Display names should be lowercase alphanumeric"

  - name: "Unresolved UUID Filtering (Guard Active)"
    id: "test-unresolved-uuid-guard"
    description: "Verify UUID→UUID fallback mappings are filtered before LLM injection"
    endpoint: "POST /api/chat/completions"
    url: "${openwebui_url}"
    request:
      model: "${model_name}"
      messages:
        - role: "user"
          content: "tell me about relationships"
      stream: false
    auth:
      type: "bearer"
      token: "${bearer_token}"
    validations:
      - type: "response_no_uuid_pattern"
        path: "choices[0].message.content"
        pattern: "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
        message: "CLAUDE.md hard constraint: NO UUIDs in LLM output (Filter hard guard active)"

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 3: Entity Attributes & Scalar Facts
  # ═══════════════════════════════════════════════════════════════════

  - name: "Entity Attributes Storage"
    id: "test-entity-attributes"
    description: "Verify scalar facts (age, height, pref_name) stored and retrievable"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "attributes age height"
    validations:
      - type: "object_not_empty"
        path: "attributes"
        message: "Entity attributes must be populated"
      - type: "object_contains_any_keys"
        path: "attributes"
        keys: ["pref_name", "age", "height", "born_on"]
        message: "Should contain some scalar attributes"

  - name: "Scalar Facts Metadata Routing"
    id: "test-scalar-routing"
    description: "Verify tail_types=SCALAR facts route to entity_attributes, not facts table"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "all scalars"
    validations:
      - type: "response_has_no_field_value"
        path: "facts[*].rel_type"
        value: "pref_name"
        message: "pref_name should be in attributes, not facts table (storage path routing)"
      - type: "response_has_no_field_value"
        path: "facts[*].rel_type"
        value: "also_known_as"
        message: "also_known_as should be in attributes, not facts table"

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 4: Relationship Graph & Hierarchy
  # ═══════════════════════════════════════════════════════════════════

  - name: "Relational Facts (Graph Traversal)"
    id: "test-relational-facts"
    description: "Verify relationship facts (spouse, parent_of) in facts table with correct metadata"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "family relationships"
    validations:
      - type: "count_greater_than"
        path: "facts[?rel_type=='parent_of' || rel_type=='spouse' || rel_type=='sibling_of']"
        threshold: 2
        message: "Must have 3+ relationship facts"
      - type: "response_field_values"
        path: "facts[?rel_type=='parent_of'].fact_class"
        values: ["A", "B"]
        message: "Relationships should be Class A (user-stated) or B (inferred)"

  - name: "Hierarchy Facts (Classification Chains)"
    id: "test-hierarchy-facts"
    description: "Verify hierarchy facts (instance_of, subclass_of) present and correct"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "types classifications"
    validations:
      - type: "object_contains_any_values"
        path: "facts[*].rel_type"
        values: ["instance_of", "subclass_of", "member_of"]
        message: "Should have some hierarchy relationships"

  - name: "Bidirectional Relationship Consistency"
    id: "test-bidirectional-consistency"
    description: "Verify inverse relationships exist (parent_of ↔ child_of, spouse ↔ spouse)"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "family"
    validations:
      - type: "response_has_paired_facts"
        subject_rel: "parent_of"
        object_rel: "child_of"
        message: "Must have both parent_of and child_of for consistency"

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 5: Validation Gate & Class Assignment
  # ═══════════════════════════════════════════════════════════════════

  - name: "Fact Classification (3D Model)"
    id: "test-fact-classification"
    description: "Verify facts classified correctly: Storage Path × Confidence Class × Direction"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "all facts"
    validations:
      - type: "response_all_match"
        path: "facts[*].fact_class"
        pattern: "[ABC]"
        message: "All facts must have valid fact_class (A, B, or C)"
      - type: "response_all_match"
        path: "facts[*].confidence"
        pattern: "^(0\\.[0-9]+|1(\\.0)?)$"
        message: "All facts must have valid confidence 0.0-1.0"

  - name: "Confidence Routing & Staging"
    id: "test-confidence-routing"
    description: "Verify high-confidence Class A facts committed immediately, B/C staged"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "all"
    validations:
      - type: "count_greater_than"
        path: "facts[?fact_class=='A']"
        threshold: 5
        message: "Should have several Class A (user-stated) facts"
      - type: "response_field_values"
        path: "facts[?fact_class=='A'].confidence"
        values: [1.0, 0.95]
        message: "Class A facts should have high confidence (0.95-1.0)"

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 6: Filter Injection & LLM Output Validation
  # ═══════════════════════════════════════════════════════════════════

  - name: "Filter Memory Injection (Display Names Only)"
    id: "test-filter-memory-injection"
    description: "Verify Filter injects facts with display names, not UUIDs"
    endpoint: "POST /api/chat/completions"
    url: "${openwebui_url}"
    request:
      model: "${model_name}"
      messages:
        - role: "user"
          content: "tell me about relationships and people"
      stream: false
    auth:
      type: "bearer"
      token: "${bearer_token}"
    validations:
      - type: "response_length"
        path: "choices[0].message.content"
        min_length: 50
        message: "Response should contain injected memory (at least 50 chars)"
      - type: "response_no_uuid_pattern"
        path: "choices[0].message.content"
        pattern: "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
        message: "Filter MUST strip UUIDs before LLM sees them"
      - type: "response_contains_keywords"
        path: "choices[0].message.content"
        keywords: ["person", "relationship", "family"]
        message: "Response should acknowledge memory injection"

  - name: "LLM Query & Display Name Resolution"
    id: "test-llm-display-name-resolution"
    description: "Verify LLM receives and uses display names from memory"
    endpoint: "POST /api/chat/completions"
    url: "${openwebui_url}"
    request:
      model: "${model_name}"
      messages:
        - role: "user"
          content: "who is in my family and what are their names?"
      stream: false
    auth:
      type: "bearer"
      token: "${bearer_token}"
    validations:
      - type: "response_contains_keywords"
        path: "choices[0].message.content"
        keywords: ["family", "name", "person"]
        message: "LLM should reference family relationships by name"
      - type: "response_no_uuid_pattern"
        path: "choices[0].message.content"
        pattern: "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
        message: "NO UUIDs in LLM response (hard constraint)"

  # ═══════════════════════════════════════════════════════════════════
  # LAYER 7: Recent Bug Fixes Verification
  # ═══════════════════════════════════════════════════════════════════

  - name: "dBug-UUID-Leakage Fix (667bb0b)"
    id: "test-dBug-uuid-leakage"
    description: "Verify Filter hard guard blocks unresolved UUID→UUID facts"
    endpoint: "POST /api/chat/completions"
    url: "${openwebui_url}"
    request:
      model: "${model_name}"
      messages:
        - role: "user"
          content: "describe relationships in detail"
      stream: false
    auth:
      type: "bearer"
      token: "${bearer_token}"
    validations:
      - type: "response_no_uuid_pattern"
        path: "choices[0].message.content"
        pattern: "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
        message: "Fix 667bb0b: Filter skips UUID→UUID facts before injection"

  - name: "dBug-User-Entity-pref_name Fix (c212674)"
    id: "test-dBug-user-pref-name"
    description: "Verify user entity pref_name now in preferred_names dict"
    endpoint: "POST /query"
    request:
      user_id: "${test_user.id}"
      text: "identity"
    validations:
      - type: "object_contains_key"
        path: "preferred_names"
        key: "${test_user.id}"
        message: "Fix c212674: User entity must be in preferred_names"
      - type: "response_field_not_pattern"
        path: "preferred_names.${test_user.id}"
        pattern: "[a-f0-9]{8}-[a-f0-9]{4}"
        message: "User entity should map to display name, not UUID"

execution:
  parallel: false
  timeout_seconds: 45
  stop_on_failure: false

reporting:
  format: "markdown"
  include_response_bodies: true
  mask_sensitive: true

sensitive_fields:
  - "bearer_token"
  - "test_user.id"
  - "authorization"

success_criteria:
  min_tests_passed: 17  # Out of 18 tests
  required_tests:
    - "test-backend-health"
    - "test-preferred-names-population"
    - "test-uuid-display-name-mapping"
    - "test-unresolved-uuid-guard"
    - "test-filter-memory-injection"
    - "test-dBug-uuid-leakage"
    - "test-dBug-user-pref-name"

documentation:
  purpose: |
    Enterprise-grade comprehensive validation of FaultLine write-validated knowledge graph pipeline.
    18 tests covering all 7 layers: initialization, UUID resolution, attributes, relationships,
    validation, filter injection, and recent bug fixes. Validates CLAUDE.md hard constraints.

  critical_constraints: |
    1. NO UUIDs in user-facing output (Filter hard guard, red line)
    2. NO personal details leakage (Filter redaction fallback)
    3. preferred_names must include all entities including user (fix c212674)
    4. Unresolved UUID→UUID facts filtered before LLM (fix 667bb0b)
    5. Scalar facts routed to entity_attributes, not facts table
    6. Relationships stored with correct directionality (bidirectional validation)
    7. Facts classified A/B/C with correct confidence values

  notes: |
    Validates recent production fixes:
    - Commit 667bb0b: UUID leakage filter hard guard
    - Commit c212674: User entity pref_name in preferred_names dict
    - Complete 3D classification model (storage path × confidence × direction)
    - All validation gates operational
    - Filter injection with display names only

  usage: |
    /skill faultline-pipeline-test
    /skill faultline-pipeline-test --verbose
    /skill faultline-pipeline-test --test test-backend-health
    /skill faultline-pipeline-test --format json

  testing_methodology: |
    **CRITICAL: Always test via OpenWebUI logs, not just curl to backend.**

    Three-tier testing approach with TrueNAS SSH access:

    1. FULL PIPELINE TEST (curl to hairbrush.helpdeskpro.ca OpenWebUI API)
       ```bash
       curl -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
         -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
         -H "Content-Type: application/json" \
         -d '{
           "model": "faultline-test",
           "messages": [{"role": "user", "content": "tell me about my family and pets"}],
           "stream": false
         }' | jq '.choices[0].message.content'
       ```
       - Tests complete inlet → filter → LLM → outlet flow
       - Validates fact extraction, storage, injection, LLM response
       - SHOWS what user sees (includes memory injection)

    2. BACKEND VALIDATION (direct /query to http://192.168.40.10:8000)
       ```bash
       curl -X POST "http://192.168.40.10:8000/query" \
         -H "Content-Type: application/json" \
         -d '{
           "user_id": "10d7d879-63cd-4f31-92ce-f2c9edb760ab",
           "text": "pets and family"
         }' | jq '{facts: .facts | length, staged_facts: .staged_facts | length, attributes: .attributes | length, preferred_names: .preferred_names | keys | length}'
       ```
       - Tests raw backend data without Filter
       - Validates extraction, storage, retrieval layers
       - DOES NOT show Filter behavior

    3. DOCKER & DATABASE DIAGNOSTICS (ssh truenas)

       **OpenWebUI logs (Filter inlet/outlet):**
       ```bash
       ssh truenas -x "sudo docker logs open-webui --tail=100 -f"
       ```
       Shows: Filter /query calls, fact counts, UUID guard activity, memory injection

       **FaultLine backend logs (extraction/ingest/query):**
       ```bash
       ssh truenas -x "sudo docker logs faultline-api --tail=100 -f"
       ```
       Shows: LLM calls, validation gates, fact classification, type constraints

       **PostgreSQL direct query (database state):**
       ```bash
       ssh truenas -x "sudo docker exec -it faultline-postgres psql -U faultline -d faultline_test -c \"
         SELECT rel_type, COUNT(*) as count, AVG(confidence) as avg_conf, fact_class
         FROM facts
         GROUP BY rel_type, fact_class
         ORDER BY count DESC;
       \""
       ```
       Shows: Stored facts by rel_type, confidence distribution, class distribution

       **Check pet facts specifically:**
       ```bash
       ssh truenas -x "sudo docker exec -it faultline-postgres psql -U faultline -d faultline_test -c \"
         SELECT f.rel_type, e1.entity_type as subject_type, e2.entity_type as object_type,
                COUNT(*) as count, AVG(f.confidence) as avg_conf
         FROM facts f
         LEFT JOIN entities e1 ON f.subject_id = e1.id
         LEFT JOIN entities e2 ON f.object_id = e2.id
         WHERE f.rel_type LIKE '%pet%' OR e1.entity_type = 'Animal' OR e2.entity_type = 'Animal'
         GROUP BY f.rel_type, e1.entity_type, e2.entity_type;
       \""
       ```

       **Staged facts (validation gate issues):**
       ```bash
       ssh truenas -x "sudo docker exec -it faultline-postgres psql -U faultline -d faultline_test -c \"
         SELECT rel_type, fact_class, COUNT(*) as count, AVG(confidence) as avg_conf
         FROM staged_facts
         GROUP BY rel_type, fact_class
         ORDER BY count DESC;
       \""
       ```

    Investigation Pattern:
    1. RUN curl to hairbrush → note what user sees (has/missing memory?)
    2. RUN backend /query → note raw facts returned (extraction working?)
    3. CHECK docker logs open-webui → note /query calls, fact counts (Filter working?)
    4. CHECK docker logs faultline-api → note validation gates, LLM calls (ingest working?)
    5. QUERY facts table → note rel_types, confidence distribution (storage working?)
    6. QUERY staged_facts → note confidence gates, class assignment (validation working?)

    Common failure patterns:
    - Curl hairbrush shows "I don't have information about pets" → check backend /query
      - If backend /query returns facts → Filter not injecting (check open-webui logs)
      - If backend /query returns empty → extraction failed (check faultline-api logs)
    - Backend /query returns facts but wrong confidence → check validation gate (faultline-api logs)
    - Facts in facts table but staged_facts full → promotion blocked (check re-embedder logs)
    - Staged facts aging out → query not traversing staged_facts (check _fetch_user_facts() UNION)
