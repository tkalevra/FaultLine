---
name: troubleshoot-faultline-pipeline
description: Systematic troubleshooting of FaultLine pipeline issues using three-tier diagnostic flow
version: 1.0.0
author: Christopher
environment: pre-production

tags:
  - faultline
  - troubleshooting
  - diagnostics
  - pipeline
  - investigation

scope: |
  When user reports "X facts are not being matched properly":
  1. Run FULL PIPELINE TEST (curl to hairbrush.helpdeskpro.ca)
  2. Run BACKEND VALIDATION (/query direct to http://192.168.40.10:8000)
  3. Collect DOCKER & DATABASE diagnostics (SSH to TrueNAS)
  4. Trace through all layers: extraction → ingest → storage → query → injection

methodology: |
  **CRITICAL: Test via FULL PIPELINE, not direct backend. Filter layer is essential.**

  **Layer 1: FULL PIPELINE (User Experience via OpenWebUI)**
  Test through hairbrush.helpdeskpro.ca (includes Filter inlet/outlet, not just backend).

  ```bash
  # Example: Test pet facts extraction
  curl -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
    -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
    -H "Content-Type: application/json" \
    -d '{
      "model": "faultline-test",
      "messages": [
        {"role": "user", "content": "I have a dog named Rover who is a golden retriever"}
      ],
      "stream": false
    }' | jq '.choices[0].message.content'
  ```

  **What this tests:**
  - Filter inlet: receives message, calls /extract + /query
  - Extraction: triples returned by LLM
  - Ingest: triples validated and stored
  - Query: facts retrieved and formatted
  - Filter outlet: facts injected into LLM context
  - LLM response: acknowledges injected facts

  **What to look for:**
  - Does LLM response reference Rover? (facts injected) → pipeline works
  - Is response about a golden retriever? (fact content correct) → extraction works
  - Are there any UUIDs in response? (should be zero) → constraint #1 check

  **Layer 2: BACKEND RAW DATA (/query direct) — For debugging when Layer 1 fails**

  ONLY use this AFTER Layer 1 reveals a problem. Backend returns raw data WITHOUT Filter processing.

  ```bash
  # Test /query directly (bypasses Filter)
  curl -X POST "http://192.168.40.10:8000/query" \
    -H "Content-Type: application/json" \
    -d '{
      "user_id": "10d7d879-63cd-4f31-92ce-f2c9edb760ab",
      "text": "tell me about my dog"
    }' | jq '{facts: (.facts | length), staged: (.staged_facts | length), preferred_names: (.preferred_names | keys | length)}'
  ```

  **What this tests (backend only, no Filter):**
  - Is extraction returning triples? (check facts count)
  - Are facts being stored? (facts > 0 means yes)
  - Are preferred_names populated? (keys | length > 0 means yes)

  **Interpretation:**
  - Layer 1 fails but Layer 2 shows facts → Filter problem (UUID guard, injection logic)
  - Both layers fail → Backend problem (extraction, ingest, or storage)

  **Layer 3: DOCKER LOGS (Filter & Backend)**
  ```bash
  # Filter inlet/outlet behavior
  ssh truenas -x "sudo docker logs open-webui --tail=100 -f"
  # Look for: FaultLine Filter /query calls, fact counts, UUID guard activity

  # Backend extraction/ingest/query
  ssh truenas -x "sudo docker logs faultline-api --tail=100 -f"
  # Look for: LLM calls, validation gates, type constraints, fact classification
  ```

  **Layer 4: DATABASE STATE**
  ```bash
  # Facts by rel_type and confidence
  ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -t -c \"
    SELECT rel_type, fact_class, COUNT(*) as count, AVG(confidence) as avg_conf
    FROM facts GROUP BY rel_type, fact_class ORDER BY count DESC;
  \""

  # Specific entity investigation
  ssh truenas -x "sudo docker exec faultline-postgres psql -U faultline -d faultline_test -t -c \"
    SELECT e.id, e.entity_type, STRING_AGG(ea.alias, ', ') as names
    FROM entities e
    LEFT JOIN entity_aliases ea ON e.id = ea.entity_id
    WHERE [FILTER CONDITION]
    GROUP BY e.id, e.entity_type;
  \""
  ```

failure_diagnosis: |
  **START HERE: Run Layer 1 (full pipeline) first, then diagnose failure**

  **SYMPTOM: Layer 1 (full pipeline via hairbrush) fails - LLM says "I don't have information"**
  ```
  STEP 1: Run Layer 2 (backend /query direct)

  Layer 2 returns facts? YES → Filter problem (injection/UUID guard)
    → Go to Layer 3 (docker logs) - check OpenWebUI Filter logs
    → Look for: "uuid_guard: skipping fact" or "/query returned empty"

  Layer 2 returns facts? NO → Backend problem (extraction/ingest/storage)
    → Go to Layer 3 (docker logs) - check faultline-api logs
    → Look for: extraction errors, validation gate failures, ingest warnings

  Layer 2 returns NO facts? → Database problem
    → Go to Layer 4 (database query)
    → Check: facts table empty? staged_facts? entity_aliases?
  ```

  **SYMPTOM: Layer 2 shows facts but preferred_names dict empty**
  Entities stored but names not resolved.
  → Go to Layer 4 - check entity_aliases table
  → Check if preferred=true entries exist for pet entities
  → Root cause: Backend _populate_preferred_names() incomplete

  **SYMPTOM: Layer 2 shows facts but some have unresolved UUIDs**
  Example: preferred_names = {"uuid1": "uuid2"} (UUID→UUID, not UUID→display_name)
  → Go to Layer 4 - check entity_aliases
  → Missing preferred name registrations
  → Root cause: Entities created but names not registered

  **SYMPTOM: Layer 3 logs show "uuid_guard: skipping fact with unresolved UUID"**
  Filter can't resolve fact UUIDs to display names.
  → Layer 2 preferred_names dict doesn't include those entities
  → Root cause: Backend not finding/populating names for all entities

common_patterns: |
  1. **Entity Type = 'unknown'**
     - Entity created but type never assigned
     - Check instance_of facts in database
     - Check entity_type UPDATE logic in ingest

  2. **Facts in staged_facts, not facts**
     - Fact staged but not promoted (confirmed_count < 3)
     - Or Class C expired (age > 30 days)
     - Check re-embedder logs for promotion/expiry

  3. **Preferred names dict missing entities**
     - _populate_preferred_names() only scans merged_facts
     - Entities without direct relational facts to user might be skipped
     - Check if entity_aliases table has preferred names registered

