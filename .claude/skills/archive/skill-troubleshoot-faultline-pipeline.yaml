output: |
  After troubleshooting, document:
  1. Which layer failed (extraction, ingest, storage, query, injection)
  2. Specific error messages or missing data
  3. Database state evidence (facts counts, types, preferred_names)
  4. Filter activity (UUID guard skips, /query calls)

  Then invoke /skill investigate-faultline-constraints for root cause analysis
