---
# FaultLine Corrections Test Skill
# Tests user corrections and confidence reassignment
# Chainable: run after test-pipeline-transparent
# Use: /skill test-faultline-corrections

name: test-faultline-corrections
description: "Test user corrections (Class A override) and fact updates"
version: 1.0.0
author: Christopher

tags:
  - faultline
  - corrections
  - user-override
  - class-a

config:
  openwebui_url: "https://hairbrush.helpdeskpro.ca"
  bearer_token: "sk-a2d41543706140fbae32088110d9f0cf"
  model_name: "faultline-test"
  truenas_ssh: "ssh truenas -x"
  database_user: "faultline"
  database_name: "faultline_test"
  postgres_container: "faultline-postgres"

steps:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 1: CAPTURE INITIAL STATE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Capture initial Des age"
    id: "step-capture-initial"
    description: "Query DB for Des's age before correction"
    sql_query: |
      SELECT
        ea.value_text as age,
        f.confidence as confidence_before
      FROM entity_attributes ea
      JOIN entities e ON ea.entity_id = e.id
      LEFT JOIN facts f ON f.subject_id = e.id AND f.rel_type = 'age'
      WHERE ea.attribute = 'age'
        AND e.id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'des'
        );
    expected:
      age_before: "12"
    on_failure: "STOP: Cannot find Des's initial age. Run test-pipeline-transparent first."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 2: SEND CORRECTION #1 (age)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Correction: Des is 14 not 12"
    id: "step-correction-age"
    description: "User states Des's correct age"
    payload: |
      {
        "model": "faultline-test",
        "messages": [
          {
            "role": "user",
            "content": "Desmonde is 14 not 12"
          }
        ],
        "stream": false
      }
    curl_command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{PAYLOAD}' | jq '.'
    validations:
      - type: "http_status"
        expected: 200
        on_failure: "STOP: OpenWebUI returned error. Check endpoint."
      - type: "response_field"
        field: "choices[0].message.content"
        should_exist: true
        on_failure: "STOP: No response from model."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 3: VALIDATE CORRECTION IN DB
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate Des age updated to 14"
    id: "step-validate-age-update"
    description: "Check entity_attributes shows Des age as 14"
    sql_query: |
      SELECT
        ea.value_text as age_after,
        ea.entity_id,
        (SELECT alias FROM entity_aliases WHERE entity_id = ea.entity_id AND is_preferred = true LIMIT 1) as display_name
      FROM entity_attributes ea
      WHERE ea.attribute = 'age'
        AND ea.entity_id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'des'
        );
    expected:
      age_after: "14"
      display_name: "des"
    on_failure: "STOP: Age not updated in entity_attributes. Check correction pipeline."

  - name: "Validate correction is Class A (confidence 1.0)"
    id: "step-validate-correction-class"
    description: "Check that correction facts are marked with high confidence"
    sql_query: |
      SELECT
        fact_class,
        confidence,
        provenance,
        COUNT(*) as count
      FROM facts
      WHERE subject_id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'des'
        )
        AND rel_type IN ('age', 'pref_name', 'also_known_as')
      GROUP BY fact_class, confidence, provenance
      ORDER BY confidence DESC;
    expected:
      confidence_min: 1.0
    on_failure: "STOP: Corrections not marked as Class A/confidence 1.0. Check validation gate."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 4: SEND CORRECTION #2 (name preference)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Correction: I prefer Christopher not Chris"
    id: "step-correction-name"
    description: "User updates name preference"
    payload: |
      {
        "model": "faultline-test",
        "messages": [
          {
            "role": "user",
            "content": "Actually, call me Christopher"
          }
        ],
        "stream": false
      }
    curl_command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{PAYLOAD}' | jq '.'
    validations:
      - type: "http_status"
        expected: 200
        on_failure: "STOP: OpenWebUI returned error."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 5: VALIDATE NAME PREFERENCE UPDATED
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate Christopher is now preferred (not chris)"
    id: "step-validate-name-preference"
    description: "Check entity_aliases shows Christopher as is_preferred=true"
    sql_query: |
      SELECT
        alias,
        is_preferred,
        COUNT(*) as count
      FROM entity_aliases
      WHERE entity_id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'christopher'
        )
      ORDER BY is_preferred DESC, alias;
    expected:
      preferred_alias: "christopher"
      alt_aliases: ["chris"]
    on_failure: "STOP: Name preference not updated. Check name conflict resolution."

summary:
  success: |
    ✅ CORRECTIONS TEST PASSED
    - Age correction: Des 12 → 14 (updated in entity_attributes)
    - Corrections marked as Class A (confidence 1.0)
    - Name preference: chris → christopher (entity_aliases updated)
    - No data loss or UUID corruption
  failure: |
    ❌ CORRECTIONS TEST FAILED
    See STOP messages above for exact failure point.
    Next step: Run /skill investigate-faultline-failure

chainable_next:
  - "/skill test-faultline-retractions"
  - "/skill investigate-faultline-failure"
