---
# FaultLine Name Changes Test Skill
# Tests entity alias updates and preferred name changes
# Chainable: run after test-faultline-retractions
# Use: /skill test-faultline-name-changes

name: test-faultline-name-changes
description: "Test alias registration and preferred name updates"
version: 1.0.0
author: Christopher

tags:
  - faultline
  - names
  - aliases
  - entity-identity

config:
  openwebui_url: "https://hairbrush.helpdeskpro.ca"
  bearer_token: "sk-a2d41543706140fbae32088110d9f0cf"
  model_name: "faultline-test"
  truenas_ssh: "ssh truenas -x"
  database_user: "faultline"
  database_name: "faultline_test"
  postgres_container: "faultline-postgres"

steps:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 1: VERIFY CYRUS ALIASES BEFORE UPDATE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Capture Cyrus aliases before update"
    id: "step-capture-cyrus-aliases"
    description: "Check current aliases for Cyrus (should have 'cyrus' as preferred)"
    sql_query: |
      SELECT
        ea.alias,
        ea.is_preferred,
        COUNT(*) as count
      FROM entity_aliases ea
      WHERE ea.entity_id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'cyrus'
        )
      GROUP BY ea.alias, ea.is_preferred
      ORDER BY is_preferred DESC, alias;
    expected:
      aliases_before: ["cyrus"]
      preferred: "cyrus"
    on_failure: "STOP: Cannot find Cyrus aliases. Run test-pipeline-transparent first."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 2: SEND NAME ADDITION ("Call Cyrus Cy")
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Add alias: Call Cyrus Cy"
    id: "step-add-alias-cy"
    description: "User adds nickname for Cyrus"
    payload: |
      {
        "model": "faultline-test",
        "messages": [
          {
            "role": "user",
            "content": "Call Cyrus Cy"
          }
        ],
        "stream": false
      }
    curl_command: |
      curl -s -X POST "https://hairbrush.helpdeskpro.ca/api/chat/completions" \
        -H "Authorization: Bearer sk-a2d41543706140fbae32088110d9f0cf" \
        -H "Content-Type: application/json" \
        -d '{PAYLOAD}' | jq '.'
    validations:
      - type: "http_status"
        expected: 200
        on_failure: "STOP: OpenWebUI returned error."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 3: VALIDATE ALIAS REGISTERED
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate 'Cy' alias registered for Cyrus"
    id: "step-validate-cy-alias"
    description: "Check entity_aliases has both 'cyrus' and 'cy' for same entity"
    sql_query: |
      SELECT
        ea.alias,
        ea.is_preferred,
        COUNT(*) as count
      FROM entity_aliases ea
      WHERE ea.entity_id IN (
          SELECT entity_id FROM entity_aliases WHERE alias = 'cyrus'
        )
      GROUP BY ea.alias, ea.is_preferred
      ORDER BY is_preferred DESC, alias;
    expected:
      aliases_after: ["cy", "cyrus"]
      alias_count: 2
    on_failure: "STOP: 'Cy' alias not registered. Check alias registration."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 4: VERIFY NO UUID LEAKAGE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate all aliases are display names (not UUIDs)"
    id: "step-validate-no-uuid-aliases"
    description: "Check that entity_aliases contains only human-readable names"
    sql_query: |
      SELECT
        alias,
        COUNT(*) as count,
        (alias ~ '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') as is_uuid
      FROM entity_aliases
      GROUP BY alias, is_uuid
      ORDER BY is_uuid DESC;
    expected:
      uuid_aliases: 0
      human_readable_aliases_min: 8
    on_failure: "STOP: UUID values found in aliases table! CLAUDE.md constraint violation."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STEP 5: VERIFY CONSISTENCY ACROSS TABLES
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: "Validate entity count consistency"
    id: "step-validate-entity-count"
    description: "Check that entities, entity_aliases, and facts are consistent"
    sql_query: |
      SELECT
        (SELECT COUNT(DISTINCT id) FROM entities) as entity_count,
        (SELECT COUNT(DISTINCT entity_id) FROM entity_aliases) as alias_coverage,
        (SELECT COUNT(DISTINCT subject_id) FROM facts) as fact_subjects,
        (SELECT COUNT(DISTINCT object_id) FROM facts WHERE object_id NOT IN (
          SELECT id FROM entities
        )) as orphaned_objects
      FROM entities LIMIT 1;
    expected:
      entity_count: 6
      alias_coverage: 6
      orphaned_objects: 0
    on_failure: "STOP: Entity consistency issue. Check database state."

summary:
  success: |
    ✅ NAME CHANGES TEST PASSED
    - Aliases registered for all entities (no UUIDs)
    - Cyrus/Cy alias pair created correctly
    - Entity count consistent across tables
    - No orphaned relationships
    - All CLAUDE.md constraints respected
  failure: |
    ❌ NAME CHANGES TEST FAILED
    See STOP messages above for exact failure point.
    Next step: Run /skill investigate-faultline-failure

summary_all_tests: |
  🎯 FULL PIPELINE TEST SUITE COMPLETE

  ✅ If all tests passed:
  - Database state: VALID (6 entities, relationships correct)
  - Corrections: WORKING (class A override, updates applied)
  - Retractions: WORKING (soft-delete, audit trail)
  - Names: WORKING (aliases registered, no UUID leakage)
  - Response quality: PLAIN ENGLISH (no creepy messages)

  ❌ If any test failed:
  - See failure messages above for exact point of failure
  - Run /skill investigate-faultline-failure with failure ID
  - Then /skill propose-faultline-fix to suggest solution

  All steps respect CLAUDE.md:
  - NO hardcoded rel_types (all from rel_types table)
  - NO hardcoded entity logic (all metadata-driven)
  - UUID constraints enforced (display names only in aliases)
  - Scope proper (memory pipeline, not family-specific)
  - Transparent curl/SQL (no obfuscation)
