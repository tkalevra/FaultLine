# ──────────────────────────────────────────────────────────────────────────────
# FaultLine — canonical deployment
#
# FaultLine is a memory backend that hooks into an LLM you ALREADY run.
# It does not host a model itself. Point it at whatever you have — OpenWebUI,
# LM Studio, Ollama, OpenAI, Anthropic — with three variables:
#
#   LLM_BACKEND_TYPE   openwebui | ollama | lm_studio | openai | anthropic | groq | localai | raw
#   LLM_BASE_URL       host + port only; the API path is appended automatically
#   LLM_API_KEY        bearer / api key (blank for local servers that need none)
#
# Usage:
#   docker compose up -d                    # backend + MCP, talking to your LLM
#   docker compose --profile ollama up -d   # ALSO start a bundled local Ollama
#                                           # (only if you don't already run a model)
#
# Verify:  curl http://localhost:8000/health
# MCP:     http://localhost:8002/mcp        (Claude Desktop or any MCP client)
#
# Per-client setup lives in the README "Connecting a client" table — the only
# thing that changes between OpenWebUI / LM Studio / Claude is these env values.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── FaultLine backend API ───────────────────────────────────────────────────
  faultline:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # MUST be a BUILD ARG, not just runtime env: the model wheel is BAKED into the image
        # (Dockerfile `ARG SPACY_MODEL`). Setting SPACY_MODEL only in .env would leave the
        # image carrying the English model while the runtime asked for another one — and the
        # linguistic layer NO-OPs silently when the requested model isn't baked. That would
        # make a non-English language choice quietly half-inert.
        #
        # ⚠️ NOT A PARITY CLAIM. The spine's dependency chains are built and validated against
        # ENGLISH. Pointing the parser at it_core_news_sm / es_core_news_sm makes it match the
        # text; it does not make the chains correct for that language. Portable in principle
        # (the UD features they key on exist in these models), UNMEASURED in practice.
        SPACY_MODEL: ${SPACY_MODEL:-es_core_news_md}
    image: faultline:latest
    container_name: faultline-api
    ports:
      - "8000:8000"
    environment:
      # INSTALL LANGUAGE — set by quickstart.py's language gate; both EMPTY for English, which
      # makes the entrypoint's collation guard a total no-op (not one query issued).
      # FAULTLINE_DB_ICU_LOCALE is what that guard compares the live database against; it must
      # stay in lockstep with the --icu-locale in POSTGRES_INITDB_ARGS on the postgres service.
      FAULTLINE_LANGUAGE: ${FAULTLINE_LANGUAGE:-es}
      FAULTLINE_DB_ICU_LOCALE: ${FAULTLINE_DB_ICU_LOCALE:-}
      # Escape hatch for the guard — run anyway on a mismatched database. Wrong text ordering,
      # but storage and case-folding are unaffected. Deliberately opt-in.
      FAULTLINE_ALLOW_DB_LOCALE_MISMATCH: ${FAULTLINE_ALLOW_DB_LOCALE_MISMATCH:-}
      # Storage (local services below)
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://faultline:faultline@postgres:5432/faultline}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-faultline-test}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # LLM hook — point at your existing model server (see header).
      # Default assumes Ollama/LM Studio on the host. Examples:
      #   OpenWebUI:  LLM_BACKEND_TYPE=openwebui  LLM_BASE_URL=http://open-webui:8080
      #   LM Studio:  LLM_BACKEND_TYPE=lm_studio  LLM_BASE_URL=http://host.docker.internal:1234
      #   Ollama:     LLM_BACKEND_TYPE=ollama     LLM_BASE_URL=http://host.docker.internal:11434
      LLM_BACKEND_TYPE: ${LLM_BACKEND_TYPE:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_API_KEY: ${LLM_API_KEY:-}
      WGM_LLM_MODEL: ${WGM_LLM_MODEL:-qwen2.5}
      CATEGORY_LLM_MODEL: ${CATEGORY_LLM_MODEL:-qwen2.5}

      # FaultLine self-reference + tuning
      FAULTLINE_API_URL: ${FAULTLINE_API_URL:-http://faultline:8000}
      REEMBED_INTERVAL: ${REEMBED_INTERVAL:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      FAULTLINE_LOG_LEVEL: ${FAULTLINE_LOG_LEVEL:-INFO}

      # ── FOSS control plane (operator webui on :8000/) ────────────────────────
      # Operator bearer for /api/dashboard/* (seats, tokens, LLM Brain, MCP key).
      # Unset → the backend auto-mints a random one and prints it once to the logs
      # (look for the FAULTLINE_ADMIN_TOKEN line). Set it here to pin a known value.
      FAULTLINE_ADMIN_TOKEN: ${FAULTLINE_ADMIN_TOKEN:-}
      # Optional friendly MCP URL shown in the OpenWebUI tab (defaults derived).
      MCP_EXTERNAL_URL: ${MCP_EXTERNAL_URL:-}
    extra_hosts:
      # Lets the container reach an LLM running on the Docker host.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - faultline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── MCP server — same memory, exposed to Claude Desktop / any MCP client ─────
  faultline-mcp:
    image: faultline:latest
    container_name: faultline-mcp
    entrypoint: ["python", "tools/mcp_server.py", "--transport", "http", "--port", "8002"]
    ports:
      - "8002:8002"
    environment:
      FAULTLINE_API_URL: http://faultline:8000
      FAULTLINE_USER_ID: ${FAULTLINE_USER_ID:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      # Shared postgres — lets the MCP server validate per-seat tokens minted
      # from the control-plane webui AND honour rotated MCP keys immediately
      # (dashboard_seats / dashboard_mcp_keys tables, public schema). Falls back
      # to MCP_API_KEY env when the tables are empty or the DB is unreachable.
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://faultline:faultline@postgres:5432/faultline}
    depends_on:
      - faultline
    networks:
      - faultline-net
    restart: unless-stopped

  # ── PostgreSQL — fact storage (migrations run from the API entrypoint) ───────
  postgres:
    image: postgres:16-alpine
    container_name: faultline-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faultline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faultline}
      POSTGRES_DB: ${POSTGRES_DB:-faultline}
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "256MB"
      # DATABASE COLLATION — set ONCE, at initdb, and then IMMUTABLE. A collation cannot be
      # changed after the database is created without a dump/restore, which is why a non-English
      # install has to get this right on first boot or carry the wrong sort order forever.
      #
      # EMPTY for English = today's behaviour byte-for-byte (the postgres image default). A
      # non-English install sets it from the language chosen in quickstart.py, e.g.
      #   POSTGRES_INITDB_ARGS=--locale-provider=icu --icu-locale=es-ES --encoding=UTF8
      #
      # ICU, not libc, DELIBERATELY: this image ships NO es_*/it_* OS locales (`locale -a` finds
      # none), so `--locale=es_ES.utf8` FAILS outright. ICU carries its own locale data and needs
      # nothing installed. Requires PG15+; this image is 16.
      #
      # ⚠️ Only applies when the data volume is EMPTY. Against an existing volume initdb never
      # runs and this is silently ignored — which is exactly the case docker-entrypoint.sh's
      # locale guard catches and refuses to start on.
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faultline} -d ${POSTGRES_DB:-faultline}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - faultline-net
    restart: unless-stopped

  # ── Qdrant — vector index ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faultline-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - faultline-net
    restart: unless-stopped

  # ── Redis — inlet dedup cache ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: faultline-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - faultline-net
    restart: unless-stopped

  # ── Optional bundled LLM — enable with `--profile ollama` ────────────────────
  # Only for users who don't already run a model. When enabled, set
  # LLM_BACKEND_TYPE=ollama and LLM_BASE_URL=http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    container_name: faultline-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - faultline-net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  ollama_data:

networks:
  faultline-net:
    driver: bridge
