# ──────────────────────────────────────────────────────────────────────────────
# FaultLine — canonical deployment
#
# FaultLine is a memory backend that hooks into an LLM you ALREADY run.
# It does not host a model itself. Point it at whatever you have — OpenWebUI,
# LM Studio, Ollama, OpenAI, Anthropic — with three variables:
#
#   LLM_BACKEND_TYPE   openwebui | ollama | lm_studio | openai | anthropic | groq | localai | raw
#   LLM_BASE_URL       host + port only; the API path is appended automatically
#   LLM_API_KEY        bearer / api key (blank for local servers that need none)
#
# Usage:
#   docker compose up -d                    # backend + MCP, talking to your LLM
#   docker compose --profile ollama up -d   # ALSO start a bundled local Ollama
#                                           # (only if you don't already run a model)
#
# Verify:  curl http://localhost:8000/health
# MCP:     http://localhost:8002/mcp        (Claude Desktop or any MCP client)
#
# Per-client setup lives in the README "Connecting a client" table — the only
# thing that changes between OpenWebUI / LM Studio / Claude is these env values.
# ──────────────────────────────────────────────────────────────────────────────

# ── COMPOSE PROJECT NAME — PINNED ON PURPOSE (do not remove) ────────────────────────
# Compose derives the project name from the DIRECTORY when `name:` is absent. On the pre-prod
# host this file is rsync'd to /mnt/MAIN/data/docker/faultline/, which derives `faultline` — the
# SAME project label Portainer stack 55 runs under — so a stray `docker compose up` there matched
# stack 55's running services by (project, service) label and RECREATED them onto this file's
# volumes (measured 2026-09-14: postgres/redis rebound to stale volumes, the API left in
# `Created`). Pinning the name makes that mistake fail LOUD instead: Docker refuses the
# container_name conflicts ("name already in use") and touches nothing. Locally this equals the
# directory-derived name already in use (FaultLine-dev → faultline-dev), so volumes are unchanged.
# Pre-prod is deployed ONLY via Portainer stack 55 — see tools/preprod_deploy.py.
name: faultline-dev

services:

  # ── FaultLine backend API ───────────────────────────────────────────────────
  faultline:
    build:
      context: .
      dockerfile: Dockerfile
      # Baked CPU models are BUILD-time config (the wheel is downloaded at build). Defaults live in
      # the Dockerfile ARGs (validated en_core_web_sm / nomic); override here via .env if needed.
      args:
        # ⚠️ The spine deriver's chains (possessive / genitive-name / copula-measure, and the
        # Person=1 / Poss=Yes morphology they key on) were BUILT AND VALIDATED AGAINST ENGLISH.
        # A non-English install sets this from the language gate (es_core_news_sm /
        # it_core_news_sm) so the parser at least matches the text — but the chains are
        # PORTABLE IN PRINCIPLE, NOT PROVEN. Do not read a language switch as parity.
        # MUST be a BUILD ARG, not just runtime env: the model wheel is BAKED into the image
        # (Dockerfile `ARG SPACY_MODEL`). Setting SPACY_MODEL only in .env would leave the
        # image carrying a model the runtime did not ask for — and the linguistic layer
        # NO-OPs (or refuses, multilingual line) when the requested model isn't baked.
        SPACY_MODEL: ${SPACY_MODEL:-es_core_news_sm}
        FASTEMBED_MODEL: ${FASTEMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5}
    image: faultline:latest
    container_name: faultline-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # INSTALL LANGUAGE — set by quickstart.py's language gate; both EMPTY for English, which
      # makes the entrypoint's collation guard a total no-op (not one query issued).
      # FAULTLINE_DB_ICU_LOCALE is what that guard compares the live database against; it must
      # stay in lockstep with the --icu-locale in POSTGRES_INITDB_ARGS on the postgres service.
      FAULTLINE_LANGUAGE: ${FAULTLINE_LANGUAGE:-es}
      FAULTLINE_DB_ICU_LOCALE: ${FAULTLINE_DB_ICU_LOCALE:-}
      # Escape hatch for the guard — run anyway on a mismatched database. Wrong text ordering,
      # but storage and case-folding are unaffected. Deliberately opt-in.
      FAULTLINE_ALLOW_DB_LOCALE_MISMATCH: ${FAULTLINE_ALLOW_DB_LOCALE_MISMATCH:-}
      # Storage (local services below)
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://faultline:faultline@postgres:5432/faultline}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-faultline-test}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # LLM hook — point at your existing model server (see header).
      # Default assumes Ollama/LM Studio on the host. Examples:
      #   OpenWebUI:  LLM_BACKEND_TYPE=openwebui  LLM_BASE_URL=http://open-webui:8080
      #   LM Studio:  LLM_BACKEND_TYPE=lm_studio  LLM_BASE_URL=http://host.docker.internal:1234
      #   Ollama:     LLM_BACKEND_TYPE=ollama     LLM_BASE_URL=http://host.docker.internal:11434
      LLM_BACKEND_TYPE: ${LLM_BACKEND_TYPE:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Model identity is pure config (resolved via LLMModels; NO literals in code). Base model for
      # every operation = WGM_LLM_MODEL; pattern-extraction (re_embedder) = PATTERN_EXTRACTION_MODEL
      # (falls back to WGM_LLM_MODEL when unset); optional per-op override = LLM_MODEL_<OP>.
      WGM_LLM_MODEL: ${WGM_LLM_MODEL:-qwen/qwen3.5-9b}
      PATTERN_EXTRACTION_MODEL: ${PATTERN_EXTRACTION_MODEL:-qwen/qwen3.5-9b}

      # Feature flags — these carry the family/relational + temporal + dash-specifier capture work
      # and are required ON to reproduce the validated 10/10. Code-default is OFF; set ON for the
      # full feature set (overridable in .env).
      SENTENCE_PIPELINE: ${SENTENCE_PIPELINE:-true}
      SPINE_NAMING_CHAIN: ${SPINE_NAMING_CHAIN:-true}

      # FaultLine self-reference + tuning
      FAULTLINE_API_URL: ${FAULTLINE_API_URL:-http://faultline:8000}
      # Re-embedder poll interval (seconds). Prod-sane default; do NOT carry the local test value 86400.
      REEMBED_INTERVAL: ${REEMBED_INTERVAL:-300}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      FAULTLINE_LOG_LEVEL: ${FAULTLINE_LOG_LEVEL:-INFO}
      # SaaS account layer (CLOSED-SOURCE, flag-gated). OFF (default) == today's behavior.
      SAAS_MODE: ${SAAS_MODE:-}
      # BYO-LLM engine brain: master key to decrypt per-tenant LLM creds + SSRF egress allowlist.
      SAAS_LLM_CRED_KEY: ${SAAS_LLM_CRED_KEY:-}
      SAAS_LLM_ALLOWED_EGRESS: ${SAAS_LLM_ALLOWED_EGRESS:-}
    extra_hosts:
      # Lets the container reach an LLM running on the Docker host.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - faultline-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── MCP server — same memory, exposed to Claude Desktop / any MCP client ─────
  faultline-mcp:
    image: faultline:latest
    container_name: faultline-mcp
    entrypoint: ["python", "tools/mcp_server.py", "--transport", "http", "--port", "8002"]
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      FAULTLINE_API_URL: http://faultline:8000
      FAULTLINE_USER_ID: ${FAULTLINE_USER_ID:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      # SaaS account layer — the MCP container enforces the seat check + hosts /admin.
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://faultline:faultline@postgres:5432/faultline}
      SAAS_MODE: ${SAAS_MODE:-}
      SAAS_OPERATOR_KEY: ${SAAS_OPERATOR_KEY:-}
      # Tenant-console human auth (signed sessions) + BYO-LLM cred encryption + SSRF egress.
      SAAS_SESSION_SECRET: ${SAAS_SESSION_SECRET:-}
      SAAS_LLM_CRED_KEY: ${SAAS_LLM_CRED_KEY:-}
      SAAS_LLM_ALLOWED_EGRESS: ${SAAS_LLM_ALLOWED_EGRESS:-}
      # Onboarding (Phase 4): customer-facing MCP URL advertised in the config blob, and
      # OneTimeSecret credentials for the one-time onboarding link (all optional — onboard
      # falls back to returning the raw instruction blob when OTS is unset).
      SAAS_MCP_PUBLIC_URL: ${SAAS_MCP_PUBLIC_URL:-}
      OTS_API_URL: ${OTS_API_URL:-}
      OTS_USERNAME: ${OTS_USERNAME:-}
      OTS_APITOKEN: ${OTS_APITOKEN:-}
      # first-touch-cold-path round 6 — the episodic re-append drain's durability + shutdown fit.
      # The spool holds every retained-turn re-append that is not yet CONFIRMED by an answered
      # /episodic/append; it must live on a MOUNTED, WRITABLE (uid 10001) path or a recreate
      # destroys it. The stop grace is raised so the shutdown flush (MCP_EPISODIC_SHUTDOWN_FLUSH_S,
      # default half the grace, <= 5s) can land before SIGKILL; MCP_STOP_GRACE_S mirrors it so the
      # process derives its budget from the same number.
      MCP_EPISODIC_SPOOL_DIR: /var/lib/faultline-mcp/spool
      MCP_STOP_GRACE_S: "30"
      # Provisioning-kick spacing for the episodic drain (round 11). `${VAR-120}` (single dash)
      # passes an EMPTY shell value through as empty — so a local drive can hand the container a
      # bad knob and prove it boots on the default with one WARN (round 12), unset → 120.
      MCP_EPISODIC_PROV_KICK_INTERVAL_S: "${MCP_EPISODIC_PROV_KICK_INTERVAL_S-120}"
      # round 13: same pass-through for one int knob and one float knob so a local drive can hand
      # the container `inf` / `1e400` and prove it boots on the defaults with one WARN each.
      MCP_INGEST_RETRY_ATTEMPTS: "${MCP_INGEST_RETRY_ATTEMPTS-3}"
      MCP_EPISODIC_REAPPEND_BASE_S: "${MCP_EPISODIC_REAPPEND_BASE_S-2.0}"
      # round 15: the two function-level knobs the critic hung a first turn with, plus the turn wall
      MCP_PROVISIONING_POLL_SEC: "${MCP_PROVISIONING_POLL_SEC-2.0}"
      MCP_BRAIN_TIMEOUT_CLASSIFY_INTENT: "${MCP_BRAIN_TIMEOUT_CLASSIFY_INTENT-10.0}"
      MCP_TURN_WALL_S: "${MCP_TURN_WALL_S-240}"
    volumes:
      - mcp-spool:/var/lib/faultline-mcp/spool
    stop_grace_period: 30s
    depends_on:
      - faultline
    networks:
      - faultline-net
    restart: unless-stopped

  # ── PostgreSQL — fact storage (migrations run from the API entrypoint) ───────
  postgres:
    image: postgres:16-alpine
    container_name: faultline-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faultline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faultline}
      POSTGRES_DB: ${POSTGRES_DB:-faultline}
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "256MB"
      # DATABASE COLLATION — set ONCE, at initdb, and then IMMUTABLE. A collation cannot be
      # changed after the database is created without a dump/restore, which is why a non-English
      # install has to get this right on first boot or carry the wrong sort order forever.
      #
      # EMPTY for English = today's behaviour byte-for-byte (the postgres image default). A
      # non-English install sets it from the language chosen in quickstart.py, e.g.
      #   POSTGRES_INITDB_ARGS=--locale-provider=icu --icu-locale=it-IT --encoding=UTF8
      #
      # ICU, not libc, DELIBERATELY: this image ships NO es_*/it_* OS locales (`locale -a` finds
      # none), so `--locale=it_IT.utf8` FAILS outright. ICU carries its own locale data and needs
      # nothing installed. Requires PG15+; this image is 16.
      #
      # ⚠️ Only applies when the data volume is EMPTY. Against an existing volume initdb never
      # runs and this is silently ignored — which is exactly the case docker-entrypoint.sh's
      # locale guard catches and refuses to start on.
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faultline} -d ${POSTGRES_DB:-faultline}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - faultline-net
    restart: unless-stopped

  # ── Qdrant — vector index ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faultline-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - faultline-net
    restart: unless-stopped

  # ── Redis — inlet dedup cache ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: faultline-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - faultline-net
    restart: unless-stopped

  # ── Optional bundled LLM — enable with `--profile ollama` ────────────────────
  # Only for users who don't already run a model. When enabled, set
  # LLM_BACKEND_TYPE=ollama and LLM_BASE_URL=http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    container_name: faultline-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - faultline-net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  ollama_data:
  # Episodic re-append spool for faultline-mcp (round 6). A PLAIN named volume is root-owned when
  # its mountpoint does not exist in the image, and the runtime user is uid 10001 — so it is bound
  # to a host directory the runtime user can write (create it with `mkdir -p .mcp-spool && chmod
  # 1777 .mcp-spool`, or chown it to 10001). A plain named volume works once the Dockerfile
  # creates the mountpoint owned by the runtime user (`mkdir -p /var/lib/faultline-mcp/spool &&
  # chown 10001:10001 ...`) — that is a Dockerfile change, another lane's file.
  mcp-spool:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MCP_SPOOL_HOST_DIR:-${PWD}/.mcp-spool}

networks:
  faultline-net:
    driver: bridge
